server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful
  request:
    header:
      forwarded:
        strategy: framework

spring:
  # The internal CA's root (ADR 0039): /tls/ca.pem in the container, a test CA's in the tests. Kafka, Keycloak
  # and every other internal TLS peer is verified against it.
  ssl:
    bundle:
      pem:
        internal:
          truststore:
            certificate: ${TLS_TRUST_CERTIFICATE:file:/tls/ca.pem}
  # Compose secrets are files under /run/secrets; each file name becomes a property (ADR 0019).
  config:
    import: optional:configtree:/run/secrets/
  application:
    name: banking-service
  datasource:
    # Defaults match docker compose's published port, so the service also runs from the IDE.
    url: ${BANKING_DB_URL:jdbc:postgresql://127.0.0.1:5441/banking}
    username: ${BANKING_DB_USER:banking}
    # From the compose secret banking_db_password (config tree below) or the environment; no default (ADR 0019).
    password: ${banking_db_password:${BANKING_DB_PASSWORD:}}
    # With the database down, fail a request in about 2 s instead of Hikari's default 30 s.
    hikari:
      connection-timeout: ${BANKING_DB_CONNECTION_TIMEOUT:2000}
      maximum-pool-size: ${BANKING_DB_MAX_POOL_SIZE:32}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks that the entities match it.
      ddl-auto: validate
  # Its own SCRAM user on the broker; the ACLs let it write only its own topics (ADR 0022).
  kafka:
    # Producer and consumer spans, with traceparent in the record headers (ADR 0030).
    template:
      observation-enabled: true
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}
    # SCRAM inside TLS, the broker's certificate verified against the internal CA's root by name (ADR 0039).
    security:
      protocol: SASL_SSL
    ssl:
      bundle: internal
    properties:
      sasl.mechanism: SCRAM-SHA-512
      sasl.jaas.config: org.apache.kafka.common.security.scram.ScramLoginModule required username="${KAFKA_USERNAME:banking}" password="${freightflow.kafka.password}";
    admin:
      # The service starts without the broker (events wait in the outbox); a slow broker delays it at most this long.
      operation-timeout: 10s
    # Only the outbox relay produces (ADR 0025). Idempotent with acks=all: a retry inside the client never writes
    # an event twice, and an acknowledged event is on every in-sync replica.
    producer:
      acks: all
      # lz4 is pure Java; zstd would need a native library the Alpine runtime image may not load.
      compression-type: lz4
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        linger.ms: 5
        # Waiting for metadata of a topic the broker does not know (or a broker that is down) ends the send.
        max.block.ms: 5000
        request.timeout.ms: 10000
        # Within the relay's send-timeout (30 s), which is within its lease (60 s).
        delivery.timeout.ms: 25000
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true
  task:
    scheduling:
      pool:
        # The event relay can wait up to the admin timeout for a broker that is down; the sweepers keep running.
        size: 4
      thread-name-prefix: banking-sched-

freightflow:
  # Before readiness: signing keys, a query per entity, requests to its own port (WarmUpRunner).
  warm-up:
    enabled: ${WARM_UP_ENABLED:true}
    rounds: 3
    request-timeout: 5s
    timeout: 60s
    paths:
      - "/api/v1/accounts"
      - "/api/v1/fx-rates?base=EUR"
      - "/api/v1/approvals"
      - "/api/v1/ledger/reconciliation"
  # Who signs the tokens (ADRs 0016, 0017). No default issuer: banking does not start without one.
  kafka:
    # From the compose secret kafka_password (its own, ADR 0022) or the environment; no default (ADR 0019).
    password: ${kafka_password:${KAFKA_PASSWORD:}}
    # 1 on the single local broker; 3 in a real cluster, with min.insync.replicas 2.
    replication-factor: ${KAFKA_REPLICATION_FACTOR:1}
  # Transactional outbox and relay (ADR 0025); defaults in OutboxProperties.
  events:
    outbox:
      relay-enabled: ${EVENT_RELAY_ENABLED:true}
      relay-interval: ${EVENT_RELAY_INTERVAL:200ms}
      retention: ${EVENT_OUTBOX_RETENTION:7d}
  security:
    issuer-uri: ${KEYCLOAK_ISSUER_URI:}
    jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:}
    audience: banking-service
  banking:
    supported-currencies: ${BANKING_SUPPORTED_CURRENCIES:NAD,ZAR,EUR}
    transfer-locking-strategy: ${TRANSFER_LOCKING_STRATEGY:pessimistic}
    ledger:
      account-lock-timeout: ${LEDGER_ACCOUNT_LOCK_TIMEOUT:10s}
    # Card-style holds (ADR 0011)
    holds:
      default-ttl: ${HOLD_DEFAULT_TTL:7d}
      max-ttl: ${HOLD_MAX_TTL:30d}
      # However often a hold is extended, it never outlives this from its creation (ADR 0011)
      max-lifetime: ${HOLD_MAX_LIFETIME:120d}
      sweep-interval: ${HOLD_SWEEP_INTERVAL:60s}
      sweep-batch: ${HOLD_SWEEP_BATCH:100}
    # Four-eyes approvals for deposits and reversals (ADR 0021)
    approvals:
      ttl: ${APPROVAL_TTL:24h}
      sweep-interval: ${APPROVAL_SWEEP_INTERVAL:60s}
      sweep-batch: ${APPROVAL_SWEEP_BATCH:100}
    # locked | unlocked | sharded (ADR 0010). The benchmark switches it by recreating the container.
    system-accounts:
      posting-mode: ${SYSTEM_ACCOUNT_POSTING_MODE:unlocked}
      shards: ${SYSTEM_ACCOUNT_SHARDS:16}
      # Roll unlocked postings into balance checkpoints (ADR 0010)
      checkpoints-enabled: ${SYSTEM_BALANCE_CHECKPOINTS_ENABLED:true}
      checkpoint-interval: ${SYSTEM_BALANCE_CHECKPOINT_INTERVAL:60s}
    idempotency:
      ttl: ${IDEMPOTENCY_TTL:24h}
      cleanup-interval: ${IDEMPOTENCY_CLEANUP_INTERVAL:15m}
      lock-timeout: ${IDEMPOTENCY_LOCK_TIMEOUT:5s}
    fx:
      quote-ttl: ${FX_QUOTE_TTL:60s}
      default-spread: ${FX_DEFAULT_SPREAD:0.0050}
      # Daily reference rates (ADR 0034): EUR/ZAR from the ECB, NAD = ZAR under the CMA peg, cross-checked against
      # the Bank of Namibia's NAD per EUR. Stale or quarantined rates are never priced with.
      reference:
        provider: ${FX_RATE_PROVIDER:ecb}
        ecb-base-url: ${ECB_BASE_URL:https://data-api.ecb.europa.eu}
        bon-url: ${BON_RATES_URL:https://services.bon.com.na/ratestable/api/rates}
        # The ECB publishes around 16:00 CET on TARGET working days; a day's rate is due an hour after.
        publication-time: "16:00"
        publication-grace: ${FX_PUBLICATION_GRACE:1h}
        zone: Europe/Berlin
        max-age-working-days: ${FX_MAX_AGE_WORKING_DAYS:2}
        max-daily-move: ${FX_MAX_DAILY_MOVE:0.05}
        peg-tolerance: ${FX_PEG_TOLERANCE:0.02}
        refresh-interval: ${FX_REFRESH_INTERVAL:15m}
        lookback: 10
        connect-timeout: ${FX_SOURCE_CONNECT_TIMEOUT:2s}
        read-timeout: ${FX_SOURCE_READ_TIMEOUT:5s}
        retry:
          max-retries: 2
          delay: 500ms
          budget: 20s
      # Fixed mid-market rates, used only with FX_RATE_PROVIDER=static (tests that need known numbers). NAD and ZAR
      # are pegged 1:1 in the Common Monetary Area (spread 0).
      rates:
        NAD:
          ZAR: 1.00000000
          EUR: 0.05000000
        ZAR:
          NAD: 1.00000000
          EUR: 0.05000000
        EUR:
          NAD: 20.00000000
          ZAR: 20.00000000
      pair-spreads:
        NAD-ZAR: 0.0000
        ZAR-NAD: 0.0000

# A breaker per reference rate source (ADR 0013, ADR 0034). Few calls, so small windows: three failures in five open
# it, and a refresh while it is open fails at once instead of waiting out the timeouts.
resilience4j:
  circuitbreaker:
    instances:
      ecb:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 5
        minimum-number-of-calls: 3
        failure-rate-threshold: 50
        wait-duration-in-open-state: ${ECB_BREAKER_OPEN_WAIT:5m}
        permitted-number-of-calls-in-half-open-state: 1
        automatic-transition-from-open-to-half-open-enabled: true
        # A 404 is a series without observations, read as empty; other 4xx are not the ECB failing.
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException$NotFound
      bank-of-namibia:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 5
        minimum-number-of-calls: 3
        failure-rate-threshold: 50
        wait-duration-in-open-state: ${BON_BREAKER_OPEN_WAIT:30m}
        permitted-number-of-calls-in-half-open-state: 1
        automatic-transition-from-open-to-half-open-enabled: true

# Served under the path the gateway publishes them at, so Swagger UI works through the gateway unchanged.
springdoc:
  api-docs:
    path: /docs/banking/v3/api-docs
  swagger-ui:
    path: /docs/banking/swagger-ui.html
  default-produces-media-type: application/json

management:
  # OpenTelemetry (ADR 0030). Every trace is kept by the service: sampling is the collector's (tail-based, ADR 0031).
  # Nothing is exported unless the otlp profile is on (application-otlp.yml, the observability compose profile);
  # trace and span ids still reach the logs and the outbox rows without it.
  tracing:
    sampling:
      probability: 1.0
    export:
      otlp:
        enabled: false
  logging:
    export:
      otlp:
        enabled: false
  # Latency histograms for the RED dashboards and the SLOs, with a bucket on each threshold (docs/slo.md). Exemplars
  # link a bucket to a trace that landed in it (ADR 0031).
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 100ms,250ms,500ms,1s,2s
  # Metrics are scraped from /actuator/prometheus (with exemplars), not pushed over OTLP.
  otlp:
    metrics:
      export:
        enabled: false
  opentelemetry:
    tracing:
    # Follows the gateway's decision, which is to keep everything (ADR 0030).
      sampler: parent-based-always-on
    resource-attributes:
      service.version: ${SERVICE_VERSION:dev}
      deployment.environment.name: ${DEPLOYMENT_ENVIRONMENT:local}
  endpoints:
    web:
      exposure:
        # prometheus is for scraping on the internal network: the gateway routes no /actuator path here.
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

# JSON on stdout.
logging:
  level:
    # The Kafka clients log their whole configuration at INFO on every connect.
    org.apache.kafka: WARN
  structured:
    format:
      console: ecs
    ecs:
      service:
        name: ${spring.application.name}
        version: ${SERVICE_VERSION:dev}
    # The OpenTelemetry names, so a log line and its trace find each other in Grafana (ADR 0030).
    json:
      rename:
        traceId: trace_id
        spanId: span_id
