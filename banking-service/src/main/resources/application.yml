server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful
  forward-headers-strategy: framework

spring:
  application:
    name: banking-service
  datasource:
    # Defaults match docker compose's published port, so the service also runs from the IDE.
    url: ${BANKING_DB_URL:jdbc:postgresql://127.0.0.1:5441/banking}
    username: ${BANKING_DB_USER:banking}
    password: ${BANKING_DB_PASSWORD:change-me-banking}
    # With the database down, fail a request in about 2 s instead of Hikari's default 30 s.
    hikari:
      connection-timeout: ${BANKING_DB_CONNECTION_TIMEOUT:2000}
      maximum-pool-size: ${BANKING_DB_MAX_POOL_SIZE:32}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks that the entities match it.
      ddl-auto: validate
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true
  task:
    scheduling:
      pool:
        size: 2
      thread-name-prefix: banking-sched-

freightflow:
  banking:
    supported-currencies: ${BANKING_SUPPORTED_CURRENCIES:NAD,ZAR,EUR}
    transfer-locking-strategy: ${TRANSFER_LOCKING_STRATEGY:pessimistic}
    ledger:
      account-lock-timeout: ${LEDGER_ACCOUNT_LOCK_TIMEOUT:10s}
    idempotency:
      ttl: ${IDEMPOTENCY_TTL:24h}
      cleanup-interval: ${IDEMPOTENCY_CLEANUP_INTERVAL:15m}
      lock-timeout: ${IDEMPOTENCY_LOCK_TIMEOUT:5s}
    fx:
      quote-ttl: ${FX_QUOTE_TTL:60s}
      default-spread: ${FX_DEFAULT_SPREAD:0.0050}
      # Static mid-market rates (Phase 1). NAD and ZAR are pegged 1:1 in the Common Monetary Area (spread 0).
      rates:
        NAD:
          ZAR: 1.00000000
          EUR: 0.05000000
        ZAR:
          NAD: 1.00000000
          EUR: 0.05000000
        EUR:
          NAD: 20.00000000
          ZAR: 20.00000000
      pair-spreads:
        NAD-ZAR: 0.0000
        ZAR-NAD: 0.0000

# Served under the path the gateway publishes them at, so Swagger UI works through the gateway unchanged.
springdoc:
  api-docs:
    path: /docs/banking/v3/api-docs
  swagger-ui:
    path: /docs/banking/swagger-ui.html
  default-produces-media-type: application/json

management:
  endpoints:
    web:
      exposure:
        # prometheus is for scraping on the internal network: the gateway routes no /actuator path here.
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

# JSON on stdout.
logging:
  structured:
    format:
      console: ecs
    ecs:
      service:
        name: ${spring.application.name}
        version: ${SERVICE_VERSION:0.1.0}
