# Benchmark-only overrides, layered on the default stack:
#   docker compose -f docker-compose.yml -f benchmarks/compose.bench.yml up -d --wait
# pg_stat_statements shows where a transfer spends its database time; track_io_timing adds I/O waits to it.
services:
  banking-db:
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - track_io_timing=on

  # Profiling on demand: BANKING_JAVA_TOOL_OPTIONS="-XX:StartFlightRecording=..." recreates banking with JFR.
  banking-service:
    environment:
      JAVA_TOOL_OPTIONS: ${BANKING_JAVA_TOOL_OPTIONS:-}
    # The harness reads /actuator/info and /actuator/prometheus directly; the default stack publishes nothing.
    ports:
      - "127.0.0.1:8081:8081"

  # Budgets a single benchmark persona cannot reach: the benchmark measures the ledger, not the limiter.
  api-gateway:
    environment:
      RATE_LIMIT_MONEY_RPS: 100000
      RATE_LIMIT_MONEY_BURST: 100000
      RATE_LIMIT_BOOKING_RPS: 100000
      RATE_LIMIT_BOOKING_BURST: 100000
