<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${lang}" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${subject}">Subject</title>
</head>
<body style="margin:0;padding:24px;background:#f4f4f2;font-family:Arial,Helvetica,sans-serif;color:#1f2328;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
         style="max-width:560px;margin:0 auto;background:#ffffff;border:1px solid #d8d8d4;">
    <tr>
      <td style="padding:16px 24px;border-bottom:3px solid #1d4e89;font-weight:bold;font-size:18px;">FreightFlow</td>
    </tr>
    <tr>
      <td style="padding:24px;font-size:15px;line-height:1.5;">
        <p style="margin:0 0 12px;" th:text="#{greeting}">Hello,</p>
        <p style="margin:0 0 16px;" th:text="${intro}">Intro</p>
        <table role="presentation" cellpadding="0" cellspacing="0" style="margin:0 0 16px;border-collapse:collapse;"
               th:if="${!facts.isEmpty()}">
          <tr th:each="fact : ${facts}">
            <td style="padding:4px 16px 4px 0;color:#59636e;" th:text="${fact.label}">Label</td>
            <td style="padding:4px 0;font-weight:bold;" th:text="${fact.value}">Value</td>
          </tr>
        </table>
        <p style="margin:0;white-space:pre-line;" th:text="#{closing}">Kind regards</p>
      </td>
    </tr>
    <tr>
      <td style="padding:12px 24px;font-size:12px;color:#59636e;border-top:1px solid #d8d8d4;" th:text="#{footer}">
        Footer
      </td>
    </tr>
  </table>
</body>
</html>
