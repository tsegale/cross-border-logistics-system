server:
  port: ${SERVER_PORT:8083}
  shutdown: graceful
  # Mutual TLS only (ADR 0040): this service's certificate, renewed by the agent and reloaded, and a certificate from
  # the internal CA asked of every client; TLS 1.3 and 1.2. Who may call is freightflow.tls.allowed-callers.
  ssl:
    bundle: internal
    client-auth: need
    enabled-protocols: [TLSv1.3, TLSv1.2]
  request:
    header:
      forwarded:
        strategy: framework

spring:
  # This service's certificate and key from the agent, and the internal CA's root (ADR 0039): /tls in the container,
  # a test CA's in the tests. Its own port, its calls to banking, Kafka, Keycloak and every other internal TLS peer
  # use it; Spring Boot reloads it when the agent renews the certificate.
  ssl:
    bundle:
      pem:
        internal:
          reload-on-update: ${TLS_RELOAD_ON_UPDATE:true}
          keystore:
            certificate: ${TLS_CERTIFICATE:file:/tls/cert.pem}
            private-key: ${TLS_PRIVATE_KEY:file:/tls/key.pem}
          truststore:
            certificate: ${TLS_TRUST_CERTIFICATE:file:/tls/ca.pem}
  # Compose secrets are files under /run/secrets; each file name becomes a property (ADR 0019).
  config:
    import: optional:configtree:/run/secrets/
  application:
    name: notification-service
  datasource:
    url: ${NOTIFICATION_DB_URL:jdbc:postgresql://127.0.0.1:5443/notification}
    username: ${NOTIFICATION_DB_USER:notification}
    # From the compose secret notification_db_password or the environment; no default (ADR 0019).
    password: ${notification_db_password:${NOTIFICATION_DB_PASSWORD:}}
    hikari:
      connection-timeout: ${NOTIFICATION_DB_CONNECTION_TIMEOUT:2000}
      maximum-pool-size: ${NOTIFICATION_DB_MAX_POOL_SIZE:16}
  flyway:
    enabled: true
  # Its own SCRAM user; the ACLs let it read shipment and hold events and own its retry topics (ADR 0022).
  kafka:
    # Producer and consumer spans, with traceparent in the record headers (ADR 0030).
    template:
      observation-enabled: true
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}
    # SCRAM inside TLS, the broker's certificate verified against the internal CA's root by name (ADR 0039).
    security:
      protocol: SASL_SSL
    ssl:
      bundle: internal
    properties:
      sasl.mechanism: SCRAM-SHA-512
      sasl.jaas.config: org.apache.kafka.common.security.scram.ScramLoginModule required username="${KAFKA_USERNAME:notification}" password="${freightflow.kafka.password}";
    admin:
      operation-timeout: 10s
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        partition.assignment.strategy: org.apache.kafka.clients.consumer.CooperativeStickyAssignor
    listener:
      observation-enabled: true
      # Commit after each record; processed_events makes a redelivery harmless (ADR 0026).
      ack-mode: record
    # Only retry and dead-letter forwarding produce.
    producer:
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 5000
        request.timeout.ms: 10000
        # At least linger.ms + request.timeout.ms, or the producer refuses to start.
        delivery.timeout.ms: 25000
  # SMTP (ADR 0027): Mailpit in compose. Credentials from the compose secret smtp_password; no default (ADR 0019).
  mail:
    host: ${SMTP_HOST:127.0.0.1}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:freightflow}
    password: ${smtp_password:${SMTP_PASSWORD:}}
    # With SMTP_STARTTLS (compose, and every real relay): STARTTLS required, the server verified against the internal
    # root by name through the bundle's socket factory (ADR 0040). The login goes only inside TLS.
    ssl:
      bundle: internal
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}
      mail.smtp.starttls.required: ${SMTP_STARTTLS:false}
      mail.smtp.ssl.checkserveridentity: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  messages:
    basename: mail/messages
    fallback-to-system-locale: false
  thymeleaf:
    # The web views are not used; emails have their own engine (EmailRenderer).
    check-template-location: false
  mvc:
    problemdetails:
      enabled: true
  task:
    scheduling:
      pool:
        size: 4
      thread-name-prefix: notification-sched-

freightflow:
  # Whose client certificate this service takes (ADR 0040):
  # the gateway's routes, Prometheus, and itself (its healthcheck).
  tls:
    allowed-callers:
      - api-gateway
      - prometheus
      - notification-service
  kafka:
    password: ${kafka_password:${KAFKA_PASSWORD:}}
    replication-factor: ${KAFKA_REPLICATION_FACTOR:1}
  security:
    issuer-uri: ${KEYCLOAK_ISSUER_URI:}
    jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:}
    audience: notification-service
  notifications:
    from: ${NOTIFICATION_FROM:FreightFlow <notifications@freightflow.dev>}
    send-interval: ${NOTIFICATION_SEND_INTERVAL:500ms}
    retention: ${NOTIFICATION_RETENTION:90d}
  events:
    consumer:
      # Non-blocking retries (ADR 0026): 1 s, 5 s, 25 s, then the dead-letter topic.
      attempts: 4
      retry-delay: 1000
      retry-multiplier: 5
      retry-max-delay: 60000

management:
  # OpenTelemetry (ADR 0030). Every trace is kept by the service: sampling is the collector's (tail-based, ADR 0031).
  # Nothing is exported unless the otlp profile is on (application-otlp.yml, the observability compose profile);
  # trace and span ids still reach the logs and the outbox rows without it.
  tracing:
    sampling:
      probability: 1.0
    export:
      otlp:
        enabled: false
  logging:
    export:
      otlp:
        enabled: false
  # Latency histograms for the RED dashboards and the SLOs, with a bucket on each threshold (docs/slo.md). Exemplars
  # link a bucket to a trace that landed in it (ADR 0031).
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        freightflow.emails.end_to_end: true
      slo:
        http.server.requests: 100ms,250ms,500ms,1s,2s
        freightflow.emails.end_to_end: 1s,10s,60s,300s
  # Metrics are scraped from /actuator/prometheus (with exemplars), not pushed over OTLP.
  otlp:
    metrics:
      export:
        enabled: false
  opentelemetry:
    tracing:
    # Follows the gateway's decision, which is to keep everything (ADR 0030).
      sampler: parent-based-always-on
    resource-attributes:
      service.version: ${SERVICE_VERSION:dev}
      deployment.environment.name: ${DEPLOYMENT_ENVIRONMENT:local}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    # A down SMTP server delays emails (they wait in the table); it must not take the service out of rotation.
    mail:
      enabled: false

logging:
  level:
    org.apache.kafka: WARN
  structured:
    format:
      console: ecs
    ecs:
      service:
        name: ${spring.application.name}
        version: ${SERVICE_VERSION:dev}
    # The OpenTelemetry names, so a log line and its trace find each other in Grafana (ADR 0030).
    json:
      rename:
        traceId: trace_id
        spanId: span_id
