name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # No CI job calls a live API (ADR 0034): banking's rate sources are the partner simulator in compose.
  ECB_BASE_URL: https://partner-simulator:8090/ecb
  BON_RATES_URL: https://partner-simulator:8090/bon/ratestable/api/rates
  # The simulator's certificate is the internal CA's (ADR 0040).
  REFERENCE_RATES_SSL_BUNDLE: internal

jobs:
  java:
    name: Java · ${{ matrix.service }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        service: [api-gateway, banking-service, logistics-service, notification-service]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # logistics' fault-injection tests run the real banking-service image behind Toxiproxy (ADR 0013).
      - name: Build the banking-service image for logistics' fault-injection tests
        if: matrix.service == 'logistics-service'
        run: docker build -t freightflow-banking-service:latest banking-service
      # Unit tests plus Testcontainers integration tests (Docker is available on GitHub-hosted runners).
      - run: ./mvnw -B -ntp -s ../.github/maven-settings.xml verify
        working-directory: ${{ matrix.service }}

  compose:
    name: docker compose config
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Catches broken interpolation or references before anyone runs the stack.
      - run: |
          cp .env.example .env
          # Compose resolves secrets/ files and keycloak's env_file while rendering the config.
          python3 scripts/generate_secrets.py
          docker compose config --quiet
          docker compose --profile debug config --quiet
          docker compose --env-file .env --env-file infra/observability/observability.env --profile observability config --quiet
          # Kafka (ADR 0022), the notification service with its database and SMTP server (ADR 0027) and the
          # partner simulator CI's rates come from (ADR 0034) are core.
          for s in kafka kafka-init notification-service notification-db mailpit partner-simulator; do
            docker compose config --services | grep -qx "$s" || { echo "::error::$s is not in the default profile"; exit 1; }
          done

  # The stack as a user starts it. Unit and integration tests can't see a broken compose file or env wiring.
  # On main it runs the images the docker job signed, once their signatures and attestations verify (ADR 0043);
  # a pull request builds them here.
  default-stack:
    name: Default stack starts
    needs: [docker]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
      attestations: read
    env:
      PUBLISHED: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sed -e 's/change-me[^ ]*/ci-only-value/' .env.example > .env
      - name: Generate the stack's secrets into secrets/
        run: python3 scripts/generate_secrets.py
      - if: env.PUBLISHED == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*
          merge-multiple: true
          path: images
      - if: env.PUBLISHED == 'true'
        uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
        with:
          cosign-release: v3.1.6
      - if: env.PUBLISHED == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Images signed, with an SBOM and provenance, before compose runs them
        if: env.PUBLISHED == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          python3 scripts/verify_images.py --digests images --override compose.images.yml | tee images/verified.txt
          # Every later compose command in this job sees the verified images.
          echo "COMPOSE_FILE=docker-compose.yml:compose.images.yml" >> "$GITHUB_ENV"
          { echo "## Signed images (ADR 0043)"; echo; echo '```'; cat images/verified.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - run: docker compose up -d --wait --wait-timeout 900 ${{ env.PUBLISHED != 'true' && '--build' || '' }}
      # ADR 0041, on the running containers: read-only, no capability, no-new-privileges, not root, no socket.
      - name: Every container is hardened
        run: python3 scripts/check_hardening.py
      # Every container's memory peak and each JVM's heap, non-heap and threads through the rest of the job (ADR 0029).
      - name: Start sampling memory
        run: mkdir -p memory && nohup python3 benchmarks/memory_peaks.py --stop-file "$RUNNER_TEMP/memory.stop" --json memory/memory.json > memory/memory.md 2> memory/memory.err &
      - name: Every service is ready, the gateway included
        run: |
          # The gateway's actuator is on its management port (8085); /actuator on 8080 is a 404 (ADR 0015).
          curl -fsS --cacert "$(python3 scripts/internal_ca.py)" "https://127.0.0.1:8085/actuator/health/readiness"; echo
          # Services and databases publish nothing by default (ADR 0019): ask compose for their health.
          for service in banking-service logistics-service notification-service keycloak kafka mailpit; do
            test "$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q "$service")")" = healthy
          done
          # A TCP connect, not curl: Postgres doesn't speak HTTP, so curl fails against a published database port too.
          for port in 8081 8082 8083 5441 5442 5443 9092 29092 1025 8025 8180 8443 9000; do
            if timeout 2 bash -c "</dev/tcp/127.0.0.1/$port" 2>/dev/null; then echo "::error::port $port is published"; exit 1; fi
          done
      # Straight after --wait and before anything else warms the stack: what the first users of a fresh start get.
      - name: First requests after a cold start
        run: |
          set -o pipefail
          python3 benchmarks/first_requests.py --json first-requests.json | tee first-requests.md
          runner="$(lscpu | sed -n 's/^Model name:[[:space:]]*//p' | head -1), $(nproc) vCPUs, $(free -m | awk '/^Mem:/ {print $2}') MiB"
          { echo "## First requests after a cold start"; echo; echo "Runner: $runner"; echo; cat first-requests.md; } >> "$GITHUB_STEP_SUMMARY"
      - name: Seed demo data
        run: ./scripts/seed_demo.sh
      # docs/smoke-test.md as a script: stops at the first unexpected HTTP status.
      - name: Smoke test through the gateway
        run: ./scripts/smoke_test.sh
      # ADR 0040 against the running stack: every endpoint verified by name, plaintext refused in its own protocol, and
      # the services' mutual TLS refusing no certificate and one from another CA that carries an allowed name.
      - name: Plaintext and foreign certificates are refused
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/untrusted" tls-probe
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -keyout "$RUNNER_TEMP/untrusted/key.pem" \
            -subj /CN=api-gateway -addext subjectAltName=DNS:api-gateway -days 1 \
            -out "$RUNNER_TEMP/untrusted/cert.pem" 2> /dev/null
          chmod 0644 "$RUNNER_TEMP/untrusted/key.pem"
          docker run --rm --network freightflow_default -v freightflow_certs:/certs:ro -v "$PWD/scripts:/probe:ro" \
            -v "$RUNNER_TEMP/untrusted:/untrusted:ro" -v "$PWD/tls-probe:/out" python:3.15.2-alpine@sha256:0f9552bb28711333da16915ec146f5e6bb44a7fdac9ced15dc17c2e0206346dd \
            python -I /probe/tls_probe.py --json /out/tls-probe.json | tee tls-probe/tls-probe.txt
          { echo "## Transport security (ADR 0040)"; echo; echo '```'; cat tls-probe/tls-probe.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      # ADR 0039 and 0040: every certificate renewed at once while customers book; each endpoint must serve its new one
      # without a restart, no request may fail, and every booking's email must arrive.
      - name: Every certificate renewed under traffic
        run: |
          set -o pipefail
          python3 scripts/rotation_test.py --json tls-probe/rotation.json | tee tls-probe/rotation.txt
          { echo "## Certificate rotation under traffic"; echo; echo '```'; cat tls-probe/rotation.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      # ADR 0044: after the smoke test, the rotation and their traffic, every invariant holds across both services
      # and the topics.
      - name: Invariants hold
        run: |
          set -o pipefail
          python3 scripts/audit_invariants.py --json tls-probe/invariants.json | tee tls-probe/invariants.txt
          { echo "## Invariant audit (ADR 0044)"; echo; echo '```'; cat tls-probe/invariants.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      # ADR 0042: ZAP's API scan of the edge with a customer's token, judged by the reviewed baseline
      # (infra/zap/rules.tsv). The full rule list is written too, so a rule a new ZAP release adds can be judged.
      - name: ZAP API scan
        run: |
          set -o pipefail
          mkdir -p zap
          python3 scripts/zap_scan.py --out zap --generate | tee zap/scan.txt
          { echo "## ZAP API scan"; echo; cat zap/banking.md zap/logistics.md; } >> "$GITHUB_STEP_SUMMARY"
      - name: Memory peaks
        if: always()
        run: |
          touch "$RUNNER_TEMP/memory.stop"
          for _ in $(seq 60); do [ -s memory/memory.json ] && break; sleep 1; done
          cat memory/memory.err
          { echo "## Memory peaks, smoke test"; echo; cat memory/memory.md; } >> "$GITHUB_STEP_SUMMARY"
          cat memory/memory.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: memory-${{ github.run_id }}
          path: |
            memory/
            tls-probe/
            zap/
          retention-days: 90
      - if: failure()
        run: |
          # A container that died (an OOM kill above all) says so here; its logs alone stop without a reason.
          docker inspect -f '{{.Name}} running={{.State.Running}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}}' \
            $(docker compose ps -aq)
          docker compose logs --tail 200

  # Alert rules, the collector, Alertmanager and dashboards are code (ADR 0032, ADR 0033): each is checked by its own
  # tool, every alert has a promtool test, and the generated files match their generators.
  observability-config:
    name: Rules and dashboards as code
    runs-on: ubuntu-24.04
    env:
      PROMETHEUS_IMAGE: prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
      ALERTMANAGER_IMAGE: prom/alertmanager:v0.35.0@sha256:e638797febd034838eca8b98cdbd46f951e9bf7f178777aa8669167406a9946c
      COLLECTOR_IMAGE: otel/opentelemetry-collector-contrib:0.165.0@sha256:e40d61f10c9a617cca1ffd1be4d7e2b3a4b0f0001798ff07e58cabe82e618cea
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generated SLO rules, their tests and the dashboards match their generators
        run: |
          python3 infra/observability/rules/generate_slo_rules.py
          python3 infra/observability/grafana/build_dashboards.py
          git diff --exit-code -- infra/observability
      - name: Dashboards are valid and every panel links to traces or logs
        run: python3 scripts/check_dashboards.py infra/observability/grafana/dashboards
      - name: promtool checks the config and rules, and runs every rule test
        run: |
          docker run --rm -v "$PWD/infra/observability:/obs:ro" --entrypoint promtool "$PROMETHEUS_IMAGE" \
            check rules /obs/rules/slo.yml /obs/rules/symptoms.yml
          docker run --rm -v "$PWD/infra/observability:/obs:ro" -w /obs/rules/tests --entrypoint promtool \
            "$PROMETHEUS_IMAGE" test rules slo.test.yml symptoms.test.yml
          # check config resolves rule_files from the path in prometheus.yml, and opens the scrape jobs' TLS files: a
          # throwaway certificate stands in for Prometheus's own and for the CA's root (ADR 0040).
          mkdir -p "$RUNNER_TEMP/prom-tls"
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -keyout "$RUNNER_TEMP/prom-tls/key.pem" \
            -subj /CN=prometheus -days 1 -out "$RUNNER_TEMP/prom-tls/cert.pem" 2> /dev/null
          cp "$RUNNER_TEMP/prom-tls/cert.pem" "$RUNNER_TEMP/prom-tls/ca.pem"
          chmod 0644 "$RUNNER_TEMP/prom-tls/key.pem"
          docker run --rm -v "$PWD/infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
            -v "$PWD/infra/observability/rules:/etc/prometheus/rules:ro" -v "$RUNNER_TEMP/prom-tls:/tls:ro" \
            --entrypoint promtool "$PROMETHEUS_IMAGE" check config /etc/prometheus/prometheus.yml
      - name: amtool checks Alertmanager's config
        run: |
          mkdir -p "$RUNNER_TEMP/secrets" "$RUNNER_TEMP/am-tls" && echo ci-only > "$RUNNER_TEMP/secrets/smtp_password"
          # Its email TLS names the CA's root: a throwaway one stands in for it.
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -keyout "$RUNNER_TEMP/am-tls/ca.key" \
            -subj /CN=ci-only -days 1 -out "$RUNNER_TEMP/am-tls/ca.pem" 2> /dev/null
          docker run --rm -v "$PWD/infra/observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro" \
            -v "$RUNNER_TEMP/secrets/smtp_password:/run/secrets/smtp_password:ro" -v "$RUNNER_TEMP/am-tls:/tls:ro" \
            --entrypoint amtool \
            "$ALERTMANAGER_IMAGE" check-config /etc/alertmanager/alertmanager.yml
      - name: The collector validates its config
        run: |
          mkdir -p "$RUNNER_TEMP/secrets"
          for name in db_monitoring_password kafka_monitoring_password; do
            echo ci-only > "$RUNNER_TEMP/secrets/$name"
          done
          # The receivers read their TLS files when the pipeline is built (the OTLP listener's certificate, Redis's and
          # the databases' root): a throwaway self-signed certificate stands in for all of them.
          mkdir -p "$RUNNER_TEMP/tls"
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -keyout "$RUNNER_TEMP/tls/key.pem" \
            -subj /CN=otel-collector -days 1 -out "$RUNNER_TEMP/tls/cert.pem" 2> /dev/null
          cp "$RUNNER_TEMP/tls/cert.pem" "$RUNNER_TEMP/tls/ca.pem"
          chmod 0644 "$RUNNER_TEMP/tls/key.pem"
          docker run --rm -v "$PWD/infra/observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro" \
            -v "$RUNNER_TEMP/secrets:/run/secrets:ro" -v "$RUNNER_TEMP/tls:/tls:ro" \
            -e TAIL_SAMPLING_PERCENTAGE=100 \
            "$COLLECTOR_IMAGE" validate --config=/etc/otelcol/config.yaml

  # The whole stack with the observability profile (ADR 0030 to 0033): one booking must be one trace in Tempo through
  # every service and asynchronous hop, its log lines in Loki, the business metrics and alert rules in Prometheus.
  observability:
    name: One trace per booking, end to end
    runs-on: ubuntu-24.04
    env:
      COMPOSE: docker compose --env-file .env --env-file infra/observability/observability.env --profile observability
      SERVICE_VERSION: ${{ github.sha }}
      DEPLOYMENT_ENVIRONMENT: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sed -e 's/change-me[^ ]*/ci-only-value/' .env.example > .env
      - run: python3 scripts/generate_secrets.py
      - run: $COMPOSE up -d --wait --wait-timeout 900 --build
      - name: Every container is hardened, the observability profile's too
        run: python3 scripts/check_hardening.py
      - name: Start sampling memory
        run: mkdir -p observability && nohup python3 benchmarks/memory_peaks.py --stop-file "$RUNNER_TEMP/memory.stop" --json observability/memory.json > observability/memory.md 2> observability/memory.err &
      - name: Seed demo data and run the smoke test
        run: |
          ./scripts/seed_demo.sh
          ./scripts/smoke_test.sh
      - name: One booking's trace, logs and metrics
        run: |
          set -o pipefail
          python3 scripts/trace_booking.py --json observability/trace.json | tee observability/trace.log
          { echo "## One booking, end to end"; echo; echo '```'; cat observability/trace.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Memory peaks with the observability profile
        if: always()
        run: |
          touch "$RUNNER_TEMP/memory.stop"
          for _ in $(seq 60); do [ -s observability/memory.json ] && break; sleep 1; done
          cat observability/memory.err || true
          { echo "## Memory peaks, observability profile"; echo; cat observability/memory.md; } >> "$GITHUB_STEP_SUMMARY"
          cat observability/memory.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: observability-${{ github.run_id }}
          path: observability/
          retention-days: 90
      - if: failure()
        run: $COMPOSE logs --tail 150

  # Every tracked text file is stored with LF (.gitattributes). Dependabot's wrapper bumps have written mvnw.cmd into the
  # index with CRLF, which then shows as changed on every checkout.
  line-endings:
    name: Files stored with LF, text as UTF-8
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          crlf="$(git ls-files --eol | awk '$3 != "attr/-text" && ($1 == "i/crlf" || $1 == "i/mixed") {print $NF}')"
          if [ -n "$crlf" ]; then
            echo "::error::stored with CRLF (run git add --renormalize .):"; echo "$crlf"; exit 1
          fi
      # A file saved in a Windows code page renders as garbage on GitHub; docs/problems.md had two such bytes.
      - run: |
          bad="$(git ls-files --eol | awk '$1 != "i/-text" && $1 != "i/" {print $NF}' | while read -r f; do
            iconv -f UTF-8 -t UTF-8 "$f" > /dev/null 2>&1 || echo "$f"; done)"
          if [ -n "$bad" ]; then
            echo "::error::not UTF-8:"; echo "$bad"; exit 1
          fi
      # Phase 7: every action is pinned to a full commit SHA, with its version beside it for Dependabot; a tag can
      # be moved by whoever controls the action's repository, a commit cannot.
      - run: |
          unpinned="$(grep -nE '^\s*(-\s*)?uses:' .github/workflows/*.yml | grep -vE '@[0-9a-f]{40} # v[0-9.]+$' || true)"
          if [ -n "$unpinned" ]; then
            echo "::error::actions not pinned to a commit SHA with its version:"; echo "$unpinned"; exit 1
          fi

  # A changed event schema must stay compatible with the one already on main (ADR 0023): consumers built against
  # either read events written under the other. A breaking change goes to a new topic version instead.
  event-schemas:
    name: Event schemas stay compatible
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: python3 scripts/check_event_schemas.py --self-test
      - name: Compatible with the base
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          # A pull request is compared with its target; a push to main with main as it was before the push.
          if [ "$EVENT_NAME" = pull_request ]; then base="origin/$BASE_REF"; else base="$BEFORE"; fi
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then base="HEAD~1"; fi
          python3 scripts/check_event_schemas.py --base "$base"

  # Secrets in the whole history, not just this push. Reviewed findings go in .gitleaksignore.
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: >-
          docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.30.1
          git /repo --redact --no-banner

  # ADR 0043: on main, each image is pushed to GHCR, signed keyless with cosign (the certificate names this workflow),
  # with its SBOM as a signed SPDX attestation and SLSA v1 provenance from actions/attest-build-provenance. The
  # default-stack job verifies all three before compose runs the images. Pull requests build, scan and push nothing.
  docker:
    name: Docker image · ${{ matrix.service }}
    needs: [java]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/freightflow-${{ matrix.service }}
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    strategy:
      fail-fast: false
      matrix:
        service: [api-gateway, banking-service, logistics-service, notification-service]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: env.PUBLISH == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.service }}
          # Into the local daemon, for the scan and the SBOM; only the GHCR tag is pushed, below.
          push: false
          load: true
          tags: |
            freightflow/${{ matrix.service }}:ci
            ${{ env.PUBLISH == 'true' && format('{0}:{1}', env.IMAGE, github.sha) || '' }}
          # Signed attestations are added below; BuildKit's unsigned ones would only make the image an index.
          provenance: false
          sbom: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      # Third-party actions with access to the job are pinned by commit, not by a tag that can be moved.
      - name: Scan the image (fails on a CRITICAL with a fix available)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: freightflow/${{ matrix.service }}:ci
          version: v0.76.1
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: SBOM
        uses: anchore/sbom-action@dfcb83b97731532d72be422cbc51ee64adb6fd56 # v0.24.4
        with:
          image: freightflow/${{ matrix.service }}:ci
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: sbom-${{ matrix.service }}.spdx.json
          upload-release-assets: false
      - if: env.PUBLISH == 'true'
        uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
        with:
          cosign-release: v3.1.6
      - name: Push to GHCR
        id: push
        if: env.PUBLISH == 'true'
        run: |
          docker push --quiet "$IMAGE:$GITHUB_SHA"
          # The digest the registry stores, which is what is signed and verified.
          digest="$(docker buildx imagetools inspect "$IMAGE:$GITHUB_SHA" --format '{{json .Manifest}}'             | python3 -c 'import json, sys; print(json.load(sys.stdin)["digest"])')"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Sign the image, attest its SBOM
        if: env.PUBLISH == 'true'
        env:
          REFERENCE: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes "$REFERENCE"
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$REFERENCE"
          mkdir -p digest && echo "$REFERENCE" > "digest/${{ matrix.service }}.digest"
      - name: SLSA provenance
        if: env.PUBLISH == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.service }}
          path: digest/
          retention-days: 7
