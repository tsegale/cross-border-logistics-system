name: Alert fire drill

# Makes every alert fire once against the whole stack with the observability profile, and checks each fires and
# (except the slow-burn alerts, whose windows outlast it) resolves (scripts/alert_fire_drill.py, docs/slo.md).
# Started by hand: it takes about 40 minutes and stops and pauses parts of the stack on purpose.
on:
  workflow_dispatch:

concurrency:
  group: fire-drill
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  # No CI job calls a live API (ADR 0034): banking's rate sources are the partner simulator in compose.
  ECB_BASE_URL: https://partner-simulator:8090/ecb
  BON_RATES_URL: https://partner-simulator:8090/bon/ratestable/api/rates
  # The simulator's certificate is the internal CA's (ADR 0040).
  REFERENCE_RATES_SSL_BUNDLE: internal
  # Phase 4 (reference rates): banking's first rate is three working days old and off the NAD/ZAR peg, so it is
  # quarantined and stale from the start; the drill puts the sources right at the end. No other phase uses FX.
  SIMULATOR_ECB_LAG_WORKING_DAYS: "3"
  SIMULATOR_BON_FACTOR: "1.05"
  FX_REFRESH_INTERVAL: 1m
  # Phase 5 (carriers): the simulator's carrier is polled as well, so its events API can fall behind.
  DCSA_KALAHARI_MODE: POLL
  COMPOSE: docker compose --env-file .env --env-file infra/observability/observability.env -f docker-compose.yml -f benchmarks/compose.bench.yml --profile observability

jobs:
  drill:
    name: Every alert fires once
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Start the stack with the observability profile
        run: |
          sed -e 's/change-me[^ ]*/ci-only-value/' .env.example > .env
          python3 scripts/generate_secrets.py
          $COMPOSE up -d --wait --build
      - name: Record the runner
        run: |
          mkdir -p drill
          echo "$(lscpu | sed -n 's/^Model name:[[:space:]]*//p' | head -1), $(nproc) vCPUs, $(free -m | awk '/^Mem:/ {print $2}') MiB" | tee drill/runner.txt
      - name: Fire drill
        run: |
          set -o pipefail
          python3 scripts/alert_fire_drill.py --json drill/drill.json 2>&1 | tee drill/drill.log
          { echo "## Alert fire drill"; echo; echo "Runner: $(cat drill/runner.txt)"; echo; echo '```'; cat drill/drill.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Screenshots of the alerts it fired
        if: always()
        run: |
          pip install --quiet playwright==1.65.2 && python3 -m playwright install --with-deps chromium > /dev/null
          python3 scripts/grafana_screenshots.py --alerts --out drill/images || true
      # After the drill, not before: the stack starts with no usable reference rate (phase 4), so the demo's FX
      # transfer can only run once the drill has put the rates right. Every fault is undone by then.
      - name: One booking's trace, and the screenshots of it
        run: |
          ./scripts/seed_demo.sh
          python3 scripts/trace_booking.py --json drill/trace.json
          python3 scripts/grafana_screenshots.py --trace-json drill/trace.json --out drill/images || echo "::warning::screenshots failed"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: fire-drill-${{ github.run_id }}
          path: drill/
          retention-days: 90
      - if: failure()
        run: $COMPOSE logs --tail 100
