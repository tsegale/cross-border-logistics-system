name: Benchmarks

# Runs the benchmark workloads on a GitHub-hosted runner, so the numbers describe the system on a machine doing
# nothing else, not a busy laptop. Started by hand (Actions > Benchmarks > Run workflow); never on push.
# The runner's CPU, core count and memory are measured in the first step and uploaded with the results.

on:
  workflow_dispatch:
    inputs:
      suites:
        description: "Comma-separated: transfers, hot-accounts, payment-flow, system-balance, events, cdc, observability, lgtm"
        default: "transfers,hot-accounts,payment-flow,system-balance,events"
        required: true
      rounds:
        description: "Rounds per mode for transfers and hot-accounts (order rotates between rounds)"
        default: "3"
        required: true
      cdc_poll_ms:
        description: "cdc: Debezium's poll.interval.ms (its default is 500; the relay polls every 200)"
        default: "500"
        required: true
      java_gc:
        description: "Every service's collector (ADR 0029): serial (the stack's default) or g1"
        default: "serial"
        required: true

concurrency:
  group: benchmarks
  cancel-in-progress: false

permissions:
  contents: read

# bash -eo pipefail: a harness piped into tee must fail the step when it fails.
defaults:
  run:
    shell: bash

env:
  # No CI job calls a live API (ADR 0034): banking's rate sources are the partner simulator in compose.
  ECB_BASE_URL: https://partner-simulator:8090/ecb
  BON_RATES_URL: https://partner-simulator:8090/bon/ratestable/api/rates
  # The simulator's certificate is the internal CA's (ADR 0040).
  REFERENCE_RATES_SSL_BUNDLE: internal
  K6_VERSION: v2.3.0
  # docker-compose.yml passes it to every Spring service's JVM.
  JAVA_GC: ${{ inputs.java_gc == 'g1' && '-XX:+UseG1GC' || '-XX:+UseSerialGC' }}
  COMPOSE: docker compose -f docker-compose.yml -f benchmarks/compose.bench.yml

jobs:
  benchmarks:
    name: Benchmarks on a hosted runner
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Record the runner
        run: |
          mkdir -p benchmarks/out
          cpu="$(lscpu | sed -n 's/^Model name:[[:space:]]*//p' | head -1)"
          vcpus="$(nproc)"
          mem_mib="$(free -m | awk '/^Mem:/ {print $2}')"
          printf '{"runner":"%s","image":"%s","cpu":"%s","vcpus":%s,"memory_mib":%s,"docker":"%s"}\n' \
            "${RUNNER_NAME}" "${ImageOS:-ubuntu}-${ImageVersion:-unknown}" "$cpu" "$vcpus" "$mem_mib" \
            "$(docker version --format '{{.Server.Version}}')" | tee benchmarks/out/runner.json
          {
            echo "## Runner"
            echo
            echo "| CPU | vCPUs | Memory | Image |"
            echo "| --- | ---: | ---: | --- |"
            echo "| $cpu | $vcpus | ${mem_mib} MiB | ${ImageOS:-ubuntu} ${ImageVersion:-} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install k6 ${{ env.K6_VERSION }}
        run: |
          curl -fsSL "https://github.com/grafana/k6/releases/download/${K6_VERSION}/k6-${K6_VERSION}-linux-amd64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/k6-${K6_VERSION}-linux-amd64" >> "$GITHUB_PATH"

      - name: Start the stack with the benchmark overrides
        run: |
          sed -e 's/change-me[^ ]*/ci-only-value/' .env.example > .env
          python3 scripts/generate_secrets.py
          $COMPOSE up -d --wait --wait-timeout 900 --build

      # Every container's memory peak and each JVM's heap, non-heap and threads across every suite (ADR 0029).
      - name: Start sampling memory
        run: nohup python3 benchmarks/memory_peaks.py --stop-file "$RUNNER_TEMP/memory.stop" --json benchmarks/out/memory.json > benchmarks/out/memory.md 2> benchmarks/out/memory.err &

      - name: Transfers (ADR 0005)
        if: contains(inputs.suites, 'transfers')
        env:
          BENCH_ROUNDS: ${{ inputs.rounds }}
        run: |
          python3 benchmarks/run_transfer_contention.py 2>&1 | tee benchmarks/out/transfers.log
          mkdir -p benchmarks/out/transfers
          find benchmarks/out -maxdepth 1 -name '*.json' ! -name runner.json -exec mv {} benchmarks/out/transfers/ \;

      - name: Hot system accounts (ADR 0010)
        if: contains(inputs.suites, 'hot-accounts')
        env:
          BENCH_ROUNDS: ${{ inputs.rounds }}
          BENCH_SWITCH_ENV: SYSTEM_ACCOUNT_POSTING_MODE
          BENCH_SWITCH_INFO: ledger.systemPostingMode
          BENCH_STRATEGIES: locked,unlocked,sharded
          BENCH_WORKLOADS: deposits,fx_transfers
        run: |
          python3 benchmarks/run_transfer_contention.py 2>&1 | tee benchmarks/out/hot-accounts.log
          mkdir -p benchmarks/out/hot-accounts
          find benchmarks/out -maxdepth 1 -name '*.json' ! -name runner.json -exec mv {} benchmarks/out/hot-accounts/ \;
          # Back to the default mode for the suites that follow.
          $COMPOSE up -d --wait --wait-timeout 900 --force-recreate banking-service

      - name: Payment flow (ADR 0012)
        if: contains(inputs.suites, 'payment-flow')
        run: |
          mkdir -p benchmarks/out/payment-flow
          # The gateway is HTTPS (ADR 0039): k6 (Go) takes the internal CA's root as its roots, curl as its CA file.
          SSL_CERT_FILE="$(python3 scripts/internal_ca.py)"
          export SSL_CERT_FILE
          # Warm-up, discarded: the first run after a start measures the JIT, not the relay.
          # Fresh tokens for each run (they live 5 minutes); a token that cannot be fetched fails the step.
          tokens() {
            local operator checker customer
            operator="$(scripts/token.sh operator)" || return 1
            checker="$(scripts/token.sh second-operator)" || return 1
            customer="$(scripts/token.sh customer-namib-exports)" || return 1
            printf -- '-e OPERATOR_TOKEN=%s -e CHECKER_TOKEN=%s -e CUSTOMER_TOKEN=%s' "$operator" "$checker" "$customer"
          }
          args="$(tokens)"
          k6 run -q $args -e VUS=4 -e ITERATIONS_PER_VU=10 -e RUN_TAG="warmup-$GITHUB_RUN_ID" benchmarks/k6/payment_flow.js
          for vus in 8 16; do
            args="$(tokens)"
            k6 run -q $args -e VUS=$vus -e ITERATIONS_PER_VU=25 -e RUN_TAG="run-$GITHUB_RUN_ID-$vus" \
              -e SUMMARY_FILE="benchmarks/out/payment-flow/payment-$vus.json" benchmarks/k6/payment_flow.js
          done
          operator="$(scripts/token.sh operator)"
          curl -fsS --cacert "$SSL_CERT_FILE" -H "Authorization: Bearer $operator" \
            https://127.0.0.1:8080/api/v1/ledger/reconciliation \
            | tee benchmarks/out/payment-flow/reconciliation.json
          grep -q '"balanced":true' benchmarks/out/payment-flow/reconciliation.json

      - name: System account balance read at a million postings (ADR 0010)
        if: contains(inputs.suites, 'system-balance')
        run: |
          python3 benchmarks/system_balance_read.py --postings 1000000 --after 1000 --runs 30 \
            | tee benchmarks/out/system-balance.log
          { echo; echo "## System account balance read"; echo; cat benchmarks/out/system-balance.log; } >> "$GITHUB_STEP_SUMMARY"

      - name: Events, booking to email and a broker outage (ADR 0025, ADR 0027)
        if: contains(inputs.suites, 'events')
        run: |
          mkdir -p benchmarks/out/events
          set -o pipefail
          python3 benchmarks/events_to_email.py --rate 2 --seconds 120 --outage 30 --json benchmarks/out/events/events.json 2>&1 | tee benchmarks/out/events/events.log
          { echo; echo "## Events"; echo; echo '```'; cat benchmarks/out/events/events.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # Last: it restarts logistics' database with logical replication and adds Debezium (benchmarks/compose.cdc.yml).
      - name: Events, polling relay against Debezium on the same outbox (ADR 0025)
        if: contains(inputs.suites, 'cdc')
        env:
          COMPOSE: docker compose -f docker-compose.yml -f benchmarks/compose.bench.yml -f benchmarks/compose.cdc.yml
          CDC_POLL_INTERVAL_MS: ${{ inputs.cdc_poll_ms }}
        run: |
          mkdir -p benchmarks/out/cdc
          set -o pipefail
          $COMPOSE up -d --wait --wait-timeout 900
          $COMPOSE exec -T logistics-db sh -c 'psql -U "$POSTGRES_USER" -d logistics -tAc "SHOW wal_level"'
          python3 benchmarks/events_to_email.py --rate 2 --seconds 120 --outage 30 --cdc --json benchmarks/out/cdc/cdc.json 2>&1 | tee benchmarks/out/cdc/cdc.log             || { docker inspect --format 'restarts: {{.RestartCount}}' "$($COMPOSE ps -aq debezium)";
                 $COMPOSE logs --no-log-prefix debezium | grep -E '"level":"(ERROR|WARN)"' | head -40;
                 $COMPOSE logs --no-log-prefix debezium | head -60; exit 1; }
          { echo; echo "## Relay against Debezium"; echo; echo '```'; cat benchmarks/out/cdc/cdc.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # The observability stack's memory under the events workload (ADR 0032), then grafana/otel-lgtm in its place.
      - name: Observability stack under the events workload (ADR 0032)
        if: contains(inputs.suites, 'observability')
        env:
          OBS: docker compose --env-file .env --env-file infra/observability/observability.env -f docker-compose.yml -f benchmarks/compose.bench.yml --profile observability
        run: |
          mkdir -p benchmarks/out/observability
          set -o pipefail
          $OBS up -d --wait --wait-timeout 900
          COMPOSE="$OBS" nohup python3 benchmarks/memory_peaks.py --stop-file "$RUNNER_TEMP/obs.stop" --json benchmarks/out/observability/memory.json > benchmarks/out/observability/memory.md 2>&1 &
          COMPOSE="$OBS" python3 benchmarks/events_to_email.py --rate 2 --seconds 120 --outage 0 --json benchmarks/out/observability/events.json 2>&1 | tee benchmarks/out/observability/events.log
          touch "$RUNNER_TEMP/obs.stop"; for _ in $(seq 60); do [ -s benchmarks/out/observability/memory.json ] && break; sleep 1; done
          { echo; echo "## Observability stack"; echo; cat benchmarks/out/observability/memory.md; } >> "$GITHUB_STEP_SUMMARY"
          $OBS rm -sf otel-collector tempo loki prometheus alertmanager grafana

      - name: grafana/otel-lgtm under the same workload (ADR 0032)
        if: contains(inputs.suites, 'lgtm')
        env:
          LGTM: docker compose --env-file .env --env-file infra/observability/observability.env -f docker-compose.yml -f benchmarks/compose.bench.yml -f benchmarks/compose.lgtm.yml --profile lgtm
        run: |
          mkdir -p benchmarks/out/lgtm
          set -o pipefail
          $LGTM up -d --wait --wait-timeout 900
          COMPOSE="$LGTM" nohup python3 benchmarks/memory_peaks.py --stop-file "$RUNNER_TEMP/lgtm.stop" --json benchmarks/out/lgtm/memory.json > benchmarks/out/lgtm/memory.md 2>&1 &
          COMPOSE="$LGTM" python3 benchmarks/events_to_email.py --rate 2 --seconds 120 --outage 0 --json benchmarks/out/lgtm/events.json 2>&1 | tee benchmarks/out/lgtm/events.log
          touch "$RUNNER_TEMP/lgtm.stop"; for _ in $(seq 60); do [ -s benchmarks/out/lgtm/memory.json ] && break; sleep 1; done
          { echo; echo "## grafana/otel-lgtm"; echo; cat benchmarks/out/lgtm/memory.md; } >> "$GITHUB_STEP_SUMMARY"

      - name: Memory peaks
        if: always()
        run: |
          docker stats --no-stream --format '{{.Name}} {{.MemUsage}}' | tee benchmarks/out/docker-stats.txt
          touch "$RUNNER_TEMP/memory.stop"
          for _ in $(seq 60); do [ -s benchmarks/out/memory.json ] && break; sleep 1; done
          cat benchmarks/out/memory.err
          { echo; echo "## Memory peaks"; echo; cat benchmarks/out/memory.md; } >> "$GITHUB_STEP_SUMMARY"
          cat benchmarks/out/memory.md

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: benchmarks-${{ github.run_id }}
          path: benchmarks/out/
          retention-days: 90

      - if: failure()
        run: $COMPOSE logs --tail 300
