# Weekly version bumps for everything this repo pins. Grouped per ecosystem, so a framework's family of
# packages arrives as one pull request that CI can pass or fail as a whole.
version: 2
updates:
  - package-ecosystem: maven
    directories: ["/api-gateway", "/banking-service", "/logistics-service", "/notification-service"]
    schedule: { interval: weekly }
    groups:
      maven: { patterns: ["*"] }
    ignore:
      # The OpenTelemetry Logback appender is built on one OpenTelemetry API version, and must match the one Spring
      # Boot manages (ADR 0030): #8's 2.33.1-alpha needed a newer API and failed with ClassNotFoundException
      # (io.opentelemetry.api.incubator.common.ExtendedAttributes). It moves with a Spring Boot upgrade, by hand.
      - dependency-name: "io.opentelemetry.instrumentation:opentelemetry-logback-appender-1.0"

  - package-ecosystem: docker
    directories: ["/api-gateway", "/banking-service", "/logistics-service", "/notification-service"]
    schedule: { interval: weekly }
    groups:
      docker: { patterns: ["*"] }
    # A Java upgrade is a deliberate decision with its own ADR, not a bot PR. Bot PR #2 moved the build to
    # JDK 25 and the runtime to JRE 24, a non-LTS release that is already end-of-life. Patch and minor
    # updates of the same major still arrive.
    ignore:
      - dependency-name: "eclipse-temurin"
        update-types: ["version-update:semver-major"]
      # The build image is the Maven wrapper's version on Java 21, changed together with the wrapper in one commit.
      # Bot PR #7 moved it to the floating maven:3-eclipse-temurin-26, a non-LTS JDK beside a Java 21 runtime.
      - dependency-name: "maven"

  - package-ecosystem: docker-compose
    directory: "/"
    schedule: { interval: weekly }
    # A Postgres major can't open the previous major's data directory, and the tests pin their own image.
    # Upgrading is a deliberate change with a migration plan, not a bot PR. A Redis major can change its licence
    # (7.4 to 8 did, ADR 0017) and the rate-limit script's behaviour: also a deliberate change.
    ignore:
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
      - dependency-name: "redis"
        update-types: ["version-update:semver-major"]
    groups:
      compose: { patterns: ["*"] }

  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }
