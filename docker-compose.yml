# FreightFlow local stack.
#   cp .env.example .env && python scripts/generate_secrets.py && docker compose up --build
# Default profile: the gateway, Keycloak, banking and logistics, each service with its own Postgres (ADR 0001).
#   --profile debug           publishes the services and databases on 127.0.0.1 for local tools (ADR 0019)
#   --profile events          adds Kafka in KRaft mode (ADR 0003)
#   --profile notifications   adds the notification service (and Kafka)
# By default only the gateway (8080, management 8085) and Keycloak (8180, for logins) publish a port, on 127.0.0.1.
# Every secret is a file in secrets/ mounted as a compose secret; none is in this file or an image (ADR 0019).
name: freightflow

services:
  # ---------------- Databases: one per service ----------------
  banking-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: banking
      POSTGRES_USER: ${BANKING_DB_USER:?set in .env}
      POSTGRES_PASSWORD_FILE: /run/secrets/banking_db_password
    secrets: [banking_db_password]
    volumes:
      - banking-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  logistics-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: logistics
      POSTGRES_USER: ${LOGISTICS_DB_USER:?set in .env}
      POSTGRES_PASSWORD_FILE: /run/secrets/logistics_db_password
    secrets: [logistics_db_password]
    volumes:
      - logistics-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  # ---------------- Identity (ADR 0016) ----------------
  # python scripts/generate_secrets.py first. The realm is code, imported on the first start only: an existing realm
  # is left alone, so a change to the file needs: docker compose down keycloak keycloak-db && docker volume rm
  # freightflow_keycloak-db-data
  keycloak-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD_FILE: /run/secrets/keycloak_db_password
    secrets: [keycloak_db_password]
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 12

  keycloak:
    build: ./infra/keycloak
    image: freightflow-keycloak
    command: ["start", "--optimized", "--import-realm"]
    env_file:
      # Keycloak cannot read secrets from files: its admin and database passwords, and the realm's placeholders.
      - path: ./secrets/keycloak.env
        required: true
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_DB_URL_HOST: keycloak-db
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      # The public URL becomes the iss of every token, so clients and services must use exactly this. TLS belongs in
      # front of it in production (docs/threat-model.md).
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:-http://127.0.0.1:8180}
      # Services fetch keys from keycloak:8080 on the compose network; the tokens still say the public issuer.
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KEYCLOAK_WEB_ORIGIN: ${KEYCLOAK_WEB_ORIGIN:-http://127.0.0.1:3000}
    volumes:
      - ./infra/keycloak/realm:/opt/keycloak/data/import:ro
    ports:
      - "127.0.0.1:8180:8080"
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      # The image has no curl or wget. Health is on the management port, not the public one.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"status": "UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
      start_interval: 3s

  # ---------------- Services ----------------
  banking-service:
    build: ./banking-service
    environment:
      BANKING_DB_URL: jdbc:postgresql://banking-db:5432/banking
      BANKING_DB_USER: ${BANKING_DB_USER:?set in .env}
      # The password is the secret file banking_db_password, read through Spring's config tree.
      # pessimistic | conditional-update (ADR 0005). The benchmark switches it by recreating this container.
      TRANSFER_LOCKING_STRATEGY: ${TRANSFER_LOCKING_STRATEGY:-pessimistic}
      # locked | unlocked | sharded (ADR 0010); unset keeps the service default.
      SYSTEM_ACCOUNT_POSTING_MODE: ${SYSTEM_ACCOUNT_POSTING_MODE:-unlocked}
      # banking validates the relayed token itself, for its own audience (ADR 0017).
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_PUBLIC_URL:-http://127.0.0.1:8180}/realms/freightflow
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/freightflow/protocol/openid-connect/certs
    secrets: [banking_db_password]
    depends_on:
      banking-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/actuator/health/readiness > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      # A cold start next to Keycloak took 169 s on the benchmark laptop; the period does not count failures.
      start_period: 240s
      start_interval: 3s

  logistics-service:
    build: ./logistics-service
    environment:
      LOGISTICS_DB_URL: jdbc:postgresql://logistics-db:5432/logistics
      LOGISTICS_DB_USER: ${LOGISTICS_DB_USER:?set in .env}
      # Its database password and its client secret for Keycloak are secret files (ADR 0019).
      # Internal network only: holds and captures are not routed by the gateway.
      BANKING_SERVICE_URI: http://banking-service:8081
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_PUBLIC_URL:-http://127.0.0.1:8180}/realms/freightflow
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/freightflow/protocol/openid-connect/certs
      # Its own client-credentials token for banking, from Keycloak on the compose network (ADR 0019).
      KEYCLOAK_TOKEN_URI: http://keycloak:8080/realms/freightflow/protocol/openid-connect/token
    secrets: [logistics_db_password, logistics_client_secret]
    depends_on:
      keycloak:
        condition: service_healthy
      logistics-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8082/actuator/health/readiness > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      # A cold start next to Keycloak took 169 s on the benchmark laptop; the period does not count failures.
      start_period: 240s
      start_interval: 3s

  # Token buckets for the gateway's rate limits on money-moving routes (ADR 0017). Not published.
  redis:
    image: redis:8.0-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  api-gateway:
    build: ./api-gateway
    environment:
      BANKING_SERVICE_URI: http://banking-service:8081
      LOGISTICS_SERVICE_URI: http://logistics-service:8082
      # The iss in every token is Keycloak's public URL; keys come from inside the network (ADR 0017).
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_PUBLIC_URL:-http://127.0.0.1:8180}/realms/freightflow
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/freightflow/protocol/openid-connect/certs
      REDIS_HOST: redis
      RATE_LIMIT_MONEY_RPS: ${RATE_LIMIT_MONEY_RPS:-5}
      RATE_LIMIT_MONEY_BURST: ${RATE_LIMIT_MONEY_BURST:-20}
      RATE_LIMIT_BOOKING_RPS: ${RATE_LIMIT_BOOKING_RPS:-2}
      RATE_LIMIT_BOOKING_BURST: ${RATE_LIMIT_BOOKING_BURST:-10}
    ports:
      - "127.0.0.1:8080:8080"
      # Management port: health and Prometheus, not reachable through the public port (ADR 0015).
      - "127.0.0.1:8085:8085"
    depends_on:
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      banking-service:
        condition: service_healthy
      logistics-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8085/actuator/health/readiness > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # ---------------- Local tools (--profile debug) ----------------
  # Forwarders publish the services and databases on 127.0.0.1 for psql, IDE debuggers and the benchmark harness.
  # Off by default: then every request has to come through the gateway (ADR 0019).
  debug-ports:
    profiles: [debug]
    image: alpine/socat:1.8.1.1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        socat TCP-LISTEN:8081,fork,reuseaddr TCP:banking-service:8081 &
        socat TCP-LISTEN:8082,fork,reuseaddr TCP:logistics-service:8082 &
        socat TCP-LISTEN:5441,fork,reuseaddr TCP:banking-db:5432 &
        socat TCP-LISTEN:5442,fork,reuseaddr TCP:logistics-db:5432 &
        wait
    ports:
      - "127.0.0.1:8081:8081"
      - "127.0.0.1:8082:8082"
      - "127.0.0.1:5441:5441"
      - "127.0.0.1:5442:5442"

  # ---------------- Optional profiles ----------------
  # Single-node Kafka 4 in KRaft mode: no ZooKeeper (removed in Kafka 4.0).
  kafka:
    profiles: [events, notifications]
    image: apache/kafka:4.3.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,CONTROLLER://:9093,HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,HOST://127.0.0.1:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are declared by the services that own them, never created by a typo in a consumer.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "127.0.0.1:9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:29092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  notification-service:
    profiles: [notifications]
    build: ./notification-service
    ports:
      - "127.0.0.1:8083:8083"
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8083/actuator/health/readiness > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

secrets:
  # Generated by scripts/generate_secrets.py into secrets/ (git-ignored).
  banking_db_password:
    file: ./secrets/banking_db_password
  logistics_db_password:
    file: ./secrets/logistics_db_password
  keycloak_db_password:
    file: ./secrets/keycloak_db_password
  logistics_client_secret:
    file: ./secrets/logistics_client_secret

volumes:
  banking-db-data:
  logistics-db-data:
  keycloak-db-data:
  kafka-data:
