# FreightFlow local stack.
#   cp .env.example .env && docker compose up --build
# Default profile: the gateway, banking and logistics, each service with its own Postgres (ADR 0001).
#   --profile events          adds Kafka in KRaft mode (ADR 0003)
#   --profile notifications   adds the notification service (and Kafka)
# Ports are published on 127.0.0.1 only, for local tools.
name: freightflow

services:
  # ---------------- Databases: one per service ----------------
  banking-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: banking
      POSTGRES_USER: ${BANKING_DB_USER:?set in .env}
      POSTGRES_PASSWORD: ${BANKING_DB_PASSWORD:?set in .env}
    ports:
      - "127.0.0.1:5441:5432"
    volumes:
      - banking-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  logistics-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: logistics
      POSTGRES_USER: ${LOGISTICS_DB_USER:?set in .env}
      POSTGRES_PASSWORD: ${LOGISTICS_DB_PASSWORD:?set in .env}
    ports:
      - "127.0.0.1:5442:5432"
    volumes:
      - logistics-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  # ---------------- Services ----------------
  banking-service:
    build: ./banking-service
    environment:
      BANKING_DB_URL: jdbc:postgresql://banking-db:5432/banking
      BANKING_DB_USER: ${BANKING_DB_USER:?set in .env}
      BANKING_DB_PASSWORD: ${BANKING_DB_PASSWORD:?set in .env}
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      banking-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/actuator/health/readiness > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  logistics-service:
    build: ./logistics-service
    environment:
      LOGISTICS_DB_URL: jdbc:postgresql://logistics-db:5432/logistics
      LOGISTICS_DB_USER: ${LOGISTICS_DB_USER:?set in .env}
      LOGISTICS_DB_PASSWORD: ${LOGISTICS_DB_PASSWORD:?set in .env}
    ports:
      - "127.0.0.1:8082:8082"
    depends_on:
      logistics-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8082/actuator/health/readiness > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  api-gateway:
    build: ./api-gateway
    environment:
      BANKING_SERVICE_URI: http://banking-service:8081
      LOGISTICS_SERVICE_URI: http://logistics-service:8082
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      banking-service:
        condition: service_healthy
      logistics-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health/readiness > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # ---------------- Optional profiles ----------------
  # Single-node Kafka 4 in KRaft mode: no ZooKeeper (removed in Kafka 4.0).
  kafka:
    profiles: [events, notifications]
    image: apache/kafka:4.1.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,CONTROLLER://:9093,HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,HOST://127.0.0.1:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are declared by the services that own them, never created by a typo in a consumer.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "127.0.0.1:9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:29092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  notification-service:
    profiles: [notifications]
    build: ./notification-service
    ports:
      - "127.0.0.1:8083:8083"
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8083/actuator/health/readiness > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  banking-db-data:
  logistics-db-data:
  kafka-data:
