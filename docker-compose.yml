# FreightFlow local stack.
#   cp .env.example .env && python scripts/generate_secrets.py && docker compose up --build
# Default profile: the gateway, Keycloak, banking, logistics and notifications, each service with its own Postgres
# (ADR 0001), Kafka, and Mailpit as the SMTP server.
#   --profile debug           publishes the services, databases and Mailpit's web UI on 127.0.0.1 (ADR 0019)
# Kafka (KRaft, ADR 0003) is in the default stack, with a SCRAM credential per service and ACLs (ADR 0022).
# By default only the gateway publishes a port (8080, which also carries Keycloak's logins, and management 8085),
# on 127.0.0.1; Keycloak's Admin Console is on the internal network only (ADR 0041).
# Every secret is a file in secrets/ mounted as a compose secret; none is in this file or an image (ADR 0019).
# Every container has a memory limit sized from measured peaks (ADR 0029): the default stack fits a 3.7 GiB Docker VM.
# Each JVM sizes its heap from its own limit (MaxRAMPercentage) with Serial GC; JAVA_GC switches every service's
# collector at once (the benchmark compares them).
name: freightflow

# Every container (ADR 0041): its root filesystem read-only (what it writes is a volume or a tmpfs below), no Linux
# capability, and no process gaining privileges it did not start with. Each also runs as a user other than root,
# except docker-api, which needs the host's socket and holds no capability either.
x-hardened: &hardened
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

services:
  # ---------------- Certificates (ADR 0039) ----------------
  # The internal CA: step-ca, initialised on its first start from the ca_password secret. It issues 24 h certificates
  # to the agent's provisioner and renews them over mTLS. Not published; its keys stay in its volume.
  ca:
    <<: *hardened
    tmpfs:
      - /tmp:size=16m
    # Peak 67.2 MiB (memory.peak, laptop): the 54 MB step-ca binary's pages count against the limit (ADR 0029).
    mem_limit: 96m
    # smallstep/step-ca:0.30.2 without its binary's file capability (infra/ca/Dockerfile, ADR 0041).
    build: ./infra/ca
    image: freightflow-ca
    environment:
      DOCKER_STEPCA_INIT_NAME: FreightFlow Internal CA
      DOCKER_STEPCA_INIT_DNS_NAMES: ca,localhost
      DOCKER_STEPCA_INIT_PROVISIONER_NAME: freightflow
      DOCKER_STEPCA_INIT_PASSWORD_FILE: /run/secrets/ca_password
    secrets: [ca_password]
    volumes:
      - ca-data:/home/step
    healthcheck:
      test: ["CMD", "step", "ca", "health", "--ca-url", "https://localhost:9000", "--root", "/home/step/certs/root_ca.crt"]
      interval: 5s
      timeout: 5s
      retries: 24

  # Issues every identity in infra/tls/identities.conf a certificate and renews it (infra/tls/agent.sh). Each
  # container mounts its own directory of the certs volume, read-only; the agent reads the root from the CA's volume.
  cert-agent:
    <<: *hardened
    tmpfs:
      - /tmp:size=16m
    # Peak 35.2 MiB renewing all 14 (memory.peak, laptop); at 32m the 44 MB step binary was paged out and back in
    # on every call, and each certificate took 48 s (ADR 0029).
    mem_limit: 48m
    image: smallstep/step-cli:0.31.0
    entrypoint: ["/bin/sh", "/etc/freightflow/tls/agent.sh"]
    environment:
      TLS_DIR: /home/step
    # The consumers' groups, so the agent can give each its own key: app 10001, postgres 70, appuser 1000.
    # The consumers' groups: services (10001), Postgres (70), the step, Kafka and Redis images (1000), Prometheus
    # (65534, nobody).
    group_add: ["10001", "70", "1000", "65534"]
    secrets: [ca_password]
    volumes:
      - ./infra/tls:/etc/freightflow/tls:ro
      - type: volume
        source: ca-data
        target: /ca
        read_only: true
        volume:
          subpath: certs
      # On the image's home directory, which belongs to its user: the new volume takes that owner.
      - certs:/home/step
    depends_on:
      ca:
        condition: service_healthy
    healthcheck:
      # Healthy once every certificate is there and the last check is recent.
      test: ["CMD-SHELL", "test -s /home/step/ca.pem && test $$(( $$(date -u +%s) - $$(cat /home/step/.checked) )) -lt 900"]
      interval: 5s
      timeout: 5s
      retries: 60

  # ---------------- Databases: one per service ----------------
  banking-db:
    <<: *hardened
    tmpfs:
      - /tmp:size=64m
      - /var/run/postgresql:size=1m,uid=70,gid=70,mode=0775
      - /var/lib/postgresql/tls:size=1m,uid=70,gid=70,mode=0700
    mem_limit: 192m
    image: postgres:17-alpine
    # TLS from the internal CA, required for every TCP connection (infra/postgres, ADR 0039). As the image's postgres
    # user from the start, so the key it copies is its own.
    entrypoint: ["/bin/sh", "/etc/freightflow/postgres/start.sh"]
    user: "70:70"
    environment:
      POSTGRES_DB: banking
      POSTGRES_USER: ${BANKING_DB_USER:?set in .env}
      POSTGRES_PASSWORD_FILE: /run/secrets/banking_db_password
    secrets: [banking_db_password]
    volumes:
      - banking-db-data:/var/lib/postgresql/data
      - ./infra/postgres:/etc/freightflow/postgres:ro
      - type: volume
        source: certs
        target: /tls
        read_only: true
        volume:
          subpath: banking-db
    depends_on:
      cert-agent:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  logistics-db:
    <<: *hardened
    tmpfs:
      - /tmp:size=64m
      - /var/run/postgresql:size=1m,uid=70,gid=70,mode=0775
      - /var/lib/postgresql/tls:size=1m,uid=70,gid=70,mode=0700
    mem_limit: 192m
    image: postgres:17-alpine
    # TLS from the internal CA, required for every TCP connection (infra/postgres, ADR 0039). As the image's postgres
    # user from the start, so the key it copies is its own.
    entrypoint: ["/bin/sh", "/etc/freightflow/postgres/start.sh"]
    user: "70:70"
    environment:
      POSTGRES_DB: logistics
      POSTGRES_USER: ${LOGISTICS_DB_USER:?set in .env}
      POSTGRES_PASSWORD_FILE: /run/secrets/logistics_db_password
    secrets: [logistics_db_password]
    volumes:
      - logistics-db-data:/var/lib/postgresql/data
      - ./infra/postgres:/etc/freightflow/postgres:ro
      - type: volume
        source: certs
        target: /tls
        read_only: true
        volume:
          subpath: logistics-db
    depends_on:
      cert-agent:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  notification-db:
    <<: *hardened
    tmpfs:
      - /tmp:size=64m
      - /var/run/postgresql:size=1m,uid=70,gid=70,mode=0775
      - /var/lib/postgresql/tls:size=1m,uid=70,gid=70,mode=0700
    mem_limit: 128m
    image: postgres:17-alpine
    # TLS from the internal CA, required for every TCP connection (infra/postgres, ADR 0039). As the image's postgres
    # user from the start, so the key it copies is its own.
    entrypoint: ["/bin/sh", "/etc/freightflow/postgres/start.sh"]
    user: "70:70"
    environment:
      POSTGRES_DB: notification
      POSTGRES_USER: ${NOTIFICATION_DB_USER:?set in .env}
      POSTGRES_PASSWORD_FILE: /run/secrets/notification_db_password
    secrets: [notification_db_password]
    volumes:
      - notification-db-data:/var/lib/postgresql/data
      - ./infra/postgres:/etc/freightflow/postgres:ro
      - type: volume
        source: certs
        target: /tls
        read_only: true
        volume:
          subpath: notification-db
    depends_on:
      cert-agent:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  # ---------------- Identity (ADR 0016) ----------------
  # python scripts/generate_secrets.py first. The realm is code, imported on the first start only: an existing realm
  # is left alone, so a change to the file needs: docker compose down keycloak keycloak-db && docker volume rm
  # freightflow_keycloak-db-data
  keycloak-db:
    <<: *hardened
    tmpfs:
      - /tmp:size=64m
      - /var/run/postgresql:size=1m,uid=70,gid=70,mode=0775
      - /var/lib/postgresql/tls:size=1m,uid=70,gid=70,mode=0700
    mem_limit: 128m
    image: postgres:17-alpine
    # TLS from the internal CA, required for every TCP connection (infra/postgres, ADR 0039). As the image's postgres
    # user from the start, so the key it copies is its own.
    entrypoint: ["/bin/sh", "/etc/freightflow/postgres/start.sh"]
    user: "70:70"
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD_FILE: /run/secrets/keycloak_db_password
    secrets: [keycloak_db_password]
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
      - ./infra/postgres:/etc/freightflow/postgres:ro
      - type: volume
        source: certs
        target: /tls
        read_only: true
        volume:
          subpath: keycloak-db
    depends_on:
      cert-agent:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 12

  keycloak:
    <<: *hardened
    tmpfs:
      - /tmp:size=64m
      - /opt/keycloak/data:size=64m,uid=1000,gid=0,mode=0770
    mem_limit: 704m
    build: ./infra/keycloak
    image: freightflow-keycloak
    command: ["start", "--optimized", "--import-realm"]
    env_file:
      # Keycloak cannot read secrets from files: its admin and database passwords, and the realm's placeholders.
      - path: ./secrets/keycloak.env
        required: true
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_DB_URL_HOST: keycloak-db
      KC_DB_URL_DATABASE: keycloak
      # TLS to its database, verified against the internal root (ADR 0039).
      KC_DB_URL_PROPERTIES: "?sslmode=verify-full&sslrootcert=/opt/keycloak/tls/ca.pem"
      KC_DB_USERNAME: keycloak
      # The public URL becomes the iss of every token, so clients and services must use exactly this.
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:-https://127.0.0.1:8080}
      # Services fetch keys from keycloak:8443 on the compose network; the tokens still say the public issuer.
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      # Reached only through the gateway (ADR 0041), which forwards its public paths and sets X-Forwarded-*; it
      # publishes no port. The Admin Console's own address: 8443 on 127.0.0.1 with --profile debug.
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME_ADMIN: https://127.0.0.1:8443
      # HTTPS only, TLS 1.3 or 1.2 (Keycloak's default protocols), with the agent's certificate, re-read every hour:
      # a renewal leaves 8 h, so the new one is served well before the old expires (ADR 0039). The management port
      # (health, metrics) inherits the same TLS.
      KC_HTTP_ENABLED: "false"
      KC_HTTPS_PORT: "8443"
      KC_HTTPS_CERTIFICATE_FILE: /opt/keycloak/tls/cert.pem
      KC_HTTPS_CERTIFICATE_KEY_FILE: /opt/keycloak/tls/key.pem
      KC_HTTPS_CERTIFICATE_RELOAD_PERIOD: 1h
      # kc.sh's default is 70% of the limit for the heap (MaxRAMPercentage=70); half leaves its metaspace (up to
      # 256m in kc.sh) and native memory room inside the limit (ADR 0029). kc.sh keeps its G1.
      JAVA_OPTS_KC_HEAP: -XX:MaxRAMPercentage=50 -XX:InitialRAMPercentage=25
      KEYCLOAK_WEB_ORIGIN: ${KEYCLOAK_WEB_ORIGIN:-http://127.0.0.1:3000}
    volumes:
      - ./infra/keycloak/realm:/opt/keycloak/data/import:ro
      - type: volume
        source: certs
        target: /opt/keycloak/tls
        read_only: true
        volume:
          subpath: keycloak
    depends_on:
      cert-agent:
        condition: service_healthy
      keycloak-db:
        condition: service_healthy
    healthcheck:
      # Health is on the management port, over HTTPS. The image has no curl and no TLS-capable shell tool: a small
      # Java client compiled into the image (infra/keycloak/HealthCheck.java), with a heap to match.
      test: ["CMD", "java", "-Xmx16m", "-XX:+UseSerialGC", "-XX:TieredStopAtLevel=1", "-cp", "/opt/freightflow",
             "HealthCheck", "https://localhost:9000/health/ready", "/opt/keycloak/tls/ca.pem"]
      # Each probe is a JVM for 0.6 s inside Keycloak's limit (519.5 MiB anonymous at rest on the laptop): every 3 s
      # while it starts, every 30 s after.
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 60s
      start_interval: 3s

  # ---------------- Services ----------------
  banking-service:
    <<: *hardened
    tmpfs:
      - /tmp:size=64m
    mem_limit: 512m
    build: ./banking-service
    environment:
      # OpenTelemetry (ADR 0030): exported only with infra/observability/observability.env (the otlp profile).
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}
      OTLP_ENDPOINT: ${OTLP_ENDPOINT:-https://otel-collector:4318}
      SERVICE_VERSION: ${SERVICE_VERSION:-dev}
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-local}
      # Heap 45% of the 512m limit; the rest is metaspace, code cache, thread stacks and buffers (ADR 0029).
      JAVA_OPTS: >-
        -XX:MaxRAMPercentage=45 -XX:InitialRAMPercentage=20 -XX:MaxMetaspaceSize=192m -Xss512k
        -XX:+ExitOnOutOfMemoryError ${JAVA_GC:--XX:+UseSerialGC}
      BANKING_DB_URL: jdbc:postgresql://banking-db:5432/banking?sslmode=verify-full&sslrootcert=/tls/ca.pem
      BANKING_DB_USER: ${BANKING_DB_USER:?set in .env}
      # The password is the secret file banking_db_password, read through Spring's config tree.
      # pessimistic | conditional-update (ADR 0005). The benchmark switches it by recreating this container.
      TRANSFER_LOCKING_STRATEGY: ${TRANSFER_LOCKING_STRATEGY:-pessimistic}
      # locked | unlocked | sharded (ADR 0010); unset keeps the service default.
      SYSTEM_ACCOUNT_POSTING_MODE: ${SYSTEM_ACCOUNT_POSTING_MODE:-unlocked}
      # The scheduled ledger reconciliation (ADR 0031); the alert fire drill turns it off to see it noticed.
      FREIGHTFLOW_BANKING_RECONCILIATION_ENABLED: ${FREIGHTFLOW_BANKING_RECONCILIATION_ENABLED:-true}
      # banking validates the relayed token itself, for its own audience (ADR 0017).
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_PUBLIC_URL:-https://127.0.0.1:8080}/realms/freightflow
      KEYCLOAK_JWK_SET_URI: https://keycloak:8443/realms/freightflow/protocol/openid-connect/certs
      # Its own SCRAM user; the password is its own secret only, mounted as kafka_password (ADR 0022).
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_USERNAME: banking
      # Daily reference rates (ADR 0034): the ECB and the Bank of Namibia, or the partner simulator in CI.
      ECB_BASE_URL: ${ECB_BASE_URL:-https://data-api.ecb.europa.eu}
      BON_RATES_URL: ${BON_RATES_URL:-https://services.bon.com.na/ratestable/api/rates}
      # internal when the two URLs are the partner simulator's (CI): its certificate is the internal CA's (ADR 0040).
      REFERENCE_RATES_SSL_BUNDLE: ${REFERENCE_RATES_SSL_BUNDLE:-}
      FX_MAX_AGE_WORKING_DAYS: ${FX_MAX_AGE_WORKING_DAYS:-2}
      FX_REFRESH_INTERVAL: ${FX_REFRESH_INTERVAL:-15m}
    secrets:
      # The owner's password runs the migrations; the service connects as banking_app (ADR 0041).
      - banking_db_password
      - banking_db_app_password
      - db_monitoring_password
      - source: kafka_banking_password
        target: kafka_password
    volumes:
      - type: volume
        source: certs
        target: /tls
        read_only: true
        volume:
          subpath: banking-service
    depends_on:
      cert-agent:
        condition: service_healthy
      banking-db:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      # Its first rate fetch runs seconds after start; with the real sources this costs nothing.
      partner-simulator:
        condition: service_healthy
    healthcheck:
      # Mutual TLS on its one port (ADR 0040): the healthcheck presents the service's own certificate.
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "--cacert", "/tls/ca.pem", "--cert", "/tls/cert.pem",
             "--key", "/tls/key.pem", "https://localhost:8081/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      # A first start of the whole stack (four JVMs, Keycloak and Kafka at once) took up to 395 s on the benchmark
      # laptop; the period does not count failures, and start_interval keeps probing every 3 s.
      start_period: 420s
      start_interval: 3s

  logistics-service:
    <<: *hardened
    tmpfs:
      - /tmp:size=64m
    mem_limit: 576m
    build: ./logistics-service
    environment:
      # OpenTelemetry (ADR 0030): exported only with infra/observability/observability.env (the otlp profile).
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}
      OTLP_ENDPOINT: ${OTLP_ENDPOINT:-https://otel-collector:4318}
      SERVICE_VERSION: ${SERVICE_VERSION:-dev}
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-local}
      # Heap 45% of the 576m limit; the rest is metaspace, code cache, thread stacks and buffers (ADR 0029).
      JAVA_OPTS: >-
        -XX:MaxRAMPercentage=45 -XX:InitialRAMPercentage=20 -XX:MaxMetaspaceSize=192m -Xss512k
        -XX:+ExitOnOutOfMemoryError ${JAVA_GC:--XX:+UseSerialGC}
      LOGISTICS_DB_URL: jdbc:postgresql://logistics-db:5432/logistics?sslmode=verify-full&sslrootcert=/tls/ca.pem
      LOGISTICS_DB_USER: ${LOGISTICS_DB_USER:?set in .env}
      # Its database password and its client secret for Keycloak are secret files (ADR 0019).
      # Internal network only: holds and captures are not routed by the gateway.
      BANKING_SERVICE_URI: https://banking-service:8081
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_PUBLIC_URL:-https://127.0.0.1:8080}/realms/freightflow
      KEYCLOAK_JWK_SET_URI: https://keycloak:8443/realms/freightflow/protocol/openid-connect/certs
      # Its own client-credentials token for banking, from Keycloak on the compose network (ADR 0019).
      KEYCLOAK_TOKEN_URI: https://keycloak:8443/realms/freightflow/protocol/openid-connect/token
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_USERNAME: logistics
      # The carrier simulator's T&T API, polled when DCSA_KALAHARI_MODE=POLL (ADR 0037); it pushes by default.
      DCSA_KALAHARI_MODE: ${DCSA_KALAHARI_MODE:-PUSH}
      DCSA_KALAHARI_API_URL: https://partner-simulator:8090/carrier
      # The simulated carrier's certificate is the internal CA's; a real carrier's is checked against public roots.
      DCSA_SSL_BUNDLE: internal
    secrets:
      # The owner's password runs the migrations; the service connects as logistics_app (ADR 0041).
      - logistics_db_password
      - logistics_db_app_password
      - db_monitoring_password
      - logistics_client_secret
      # The carrier simulator's DCSA subscription secret (ADR 0037).
      - dcsa_carrier_secret
      - source: kafka_logistics_password
        target: kafka_password
    volumes:
      - type: volume
        source: certs
        target: /tls
        read_only: true
        volume:
          subpath: logistics-service
    depends_on:
      cert-agent:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
      logistics-db:
        condition: service_healthy
    healthcheck:
      # Mutual TLS on its one port (ADR 0040): the healthcheck presents the service's own certificate.
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "--cacert", "/tls/ca.pem", "--cert", "/tls/cert.pem",
             "--key", "/tls/key.pem", "https://localhost:8082/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      # A first start of the whole stack (four JVMs, Keycloak and Kafka at once) took up to 395 s on the benchmark
      # laptop; the period does not count failures, and start_interval keeps probing every 3 s.
      start_period: 420s
      start_interval: 3s

  # Token buckets for the gateway's rate limits on money-moving routes (ADR 0017). Not published. The gateway's tests
  # run on this same image: TestIssuer reads it from this file. Redis 8 is used under the AGPLv3 (ADR 0017).
  # TLS only, with its certificate from the internal CA, reloaded on renewal (infra/redis/start.sh, ADR 0039).
  redis:
    <<: *hardened
    tmpfs:
      - /tmp:size=1m,uid=999,gid=1000,mode=0770
    mem_limit: 32m
    image: redis:8.10-alpine
    # The image's own user; it reads its key through the group the agent gives it (infra/tls/identities.conf).
    user: "999:1000"
    entrypoint: ["sh", "/etc/freightflow/redis/start.sh"]
    volumes:
      - ./infra/redis:/etc/freightflow/redis:ro
      - type: volume
        source: certs
        target: /tls
        read_only: true
        volume:
          subpath: redis
    depends_on:
      cert-agent:
        condition: service_healthy
    healthcheck:
      # Over the container's Unix socket: the TCP port takes TLS only.
      test: ["CMD", "redis-cli", "-s", "/tmp/redis.sock", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  api-gateway:
    <<: *hardened
    tmpfs:
      - /tmp:size=64m
    mem_limit: 320m
    build: ./api-gateway
    environment:
      # OpenTelemetry (ADR 0030): exported only with infra/observability/observability.env (the otlp profile).
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}
      OTLP_ENDPOINT: ${OTLP_ENDPOINT:-https://otel-collector:4318}
      SERVICE_VERSION: ${SERVICE_VERSION:-dev}
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-local}
      # Heap 45% of the 320m limit; the rest is metaspace, code cache, thread stacks and buffers (ADR 0029).
      JAVA_OPTS: >-
        -XX:MaxRAMPercentage=45 -XX:InitialRAMPercentage=20 -XX:MaxMetaspaceSize=192m -Xss512k
        -XX:+ExitOnOutOfMemoryError ${JAVA_GC:--XX:+UseSerialGC}
      BANKING_SERVICE_URI: https://banking-service:8081
      LOGISTICS_SERVICE_URI: https://logistics-service:8082
      NOTIFICATION_SERVICE_URI: https://notification-service:8083
      KEYCLOAK_SERVICE_URI: https://keycloak:8443
      # The iss in every token is Keycloak's public URL; keys come from inside the network (ADR 0017).
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_PUBLIC_URL:-https://127.0.0.1:8080}/realms/freightflow
      KEYCLOAK_JWK_SET_URI: https://keycloak:8443/realms/freightflow/protocol/openid-connect/certs
      REDIS_HOST: redis
      RATE_LIMIT_MONEY_RPS: ${RATE_LIMIT_MONEY_RPS:-5}
      RATE_LIMIT_MONEY_BURST: ${RATE_LIMIT_MONEY_BURST:-20}
      RATE_LIMIT_BOOKING_RPS: ${RATE_LIMIT_BOOKING_RPS:-2}
      RATE_LIMIT_BOOKING_BURST: ${RATE_LIMIT_BOOKING_BURST:-10}
    ports:
      - "127.0.0.1:8080:8080"
      # Management port: health and Prometheus, not reachable through the public port (ADR 0015).
      - "127.0.0.1:8085:8085"
    volumes:
      - type: volume
        source: certs
        target: /tls
        read_only: true
        volume:
          subpath: api-gateway
    depends_on:
      cert-agent:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      banking-service:
        condition: service_healthy
      logistics-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    healthcheck:
      # Management takes the same TLS as the public listener (ADR 0039).
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "--cacert", "/tls/ca.pem",
             "https://localhost:8085/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # ---------------- Local tools (--profile debug) ----------------
  # Forwarders publish the services and databases on 127.0.0.1 for psql, IDE debuggers and the benchmark harness.
  # Off by default: then every request has to come through the gateway (ADR 0019).
  debug-ports:
    profiles: [debug]
    <<: *hardened
    tmpfs:
      - /tmp:size=1m
    mem_limit: 32m
    image: alpine/socat:1.8.1.1
    # Ports above 1024 only: no root needed (ADR 0041).
    user: "65534:65534"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        socat TCP-LISTEN:8081,fork,reuseaddr TCP:banking-service:8081 &
        socat TCP-LISTEN:8082,fork,reuseaddr TCP:logistics-service:8082 &
        socat TCP-LISTEN:5441,fork,reuseaddr TCP:banking-db:5432 &
        socat TCP-LISTEN:5442,fork,reuseaddr TCP:logistics-db:5432 &
        socat TCP-LISTEN:8083,fork,reuseaddr TCP:notification-service:8083 &
        socat TCP-LISTEN:5443,fork,reuseaddr TCP:notification-db:5432 &
        socat TCP-LISTEN:8025,fork,reuseaddr TCP:mailpit:8025 &
        socat TCP-LISTEN:8443,fork,reuseaddr TCP:keycloak:8443 &
        wait
    ports:
      - "127.0.0.1:8081:8081"
      - "127.0.0.1:8082:8082"
      - "127.0.0.1:8083:8083"
      - "127.0.0.1:5441:5441"
      - "127.0.0.1:5442:5442"
      - "127.0.0.1:5443:5443"
      # Mailpit's web UI and API: the emails the stack sent (ADR 0027).
      - "127.0.0.1:8025:8025"
      # Keycloak's Admin Console, for an administrator on this machine only (ADR 0041).
      - "127.0.0.1:8443:8443"

  # ---------------- Events ----------------
  # Single-node Kafka 4 in KRaft mode (ADR 0003): SCRAM-SHA-512 per service, ACLs, nothing published (ADR 0022).
  kafka:
    <<: *hardened
    tmpfs:
      - /tmp:size=64m,uid=1000,gid=1000,mode=0770
    mem_limit: 512m
    image: apache/kafka:4.3.1
    entrypoint: ["bash", "/etc/freightflow/kafka/start.sh"]
    environment:
      # Fixed for this one-node cluster; the storage is formatted with it once.
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
      # Inside its 512m limit with page cache and metadata log buffers beside it (ADR 0029).
      KAFKA_HEAP_OPTS: -Xms256m -Xmx256m
      # The root filesystem is read-only (ADR 0041): Kafka's and its tools' logs go to the tmpfs.
      LOG_DIR: /tmp/kafka-logs
    secrets: [kafka_admin_password]
    volumes:
      - ./infra/kafka:/etc/freightflow/kafka:ro
      - kafka-data:/var/lib/kafka/data
      # Its certificate for the SASL_SSL listener (ADR 0039).
      - type: volume
        source: certs
        target: /tls
        read_only: true
        volume:
          subpath: kafka
    depends_on:
      cert-agent:
        condition: service_healthy
    healthcheck:
      # The listener is up; kafka-init then waits for an authenticated answer before it applies users and ACLs.
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/29092'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # Service users and ACLs from infra/kafka/acls.conf, applied on every start, before any service connects.
  kafka-init:
    <<: *hardened
    tmpfs:
      - /tmp:size=16m,uid=1000,gid=1000,mode=0770
    mem_limit: 256m
    image: apache/kafka:4.3.1
    entrypoint: ["bash", "/etc/freightflow/kafka/init.sh"]
    environment:
      # The CLI tools (kafka-configs, kafka-acls) need little heap.
      KAFKA_HEAP_OPTS: -Xmx128m
      LOG_DIR: /tmp/kafka-logs
    secrets: [kafka_admin_password, kafka_banking_password, kafka_logistics_password, kafka_notification_password,
              kafka_monitoring_password]
    volumes:
      - ./infra/kafka:/etc/freightflow/kafka:ro
      # Only the CA's root, to verify the broker.
      - type: volume
        source: certs
        target: /tls
        read_only: true
        volume:
          subpath: trust
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"

  # ---------------- Notifications (ADR 0027) ----------------
  # An SMTP server that keeps what it receives and shows it (web UI and API on 8025, published by --profile debug).
  # SMTP needs a login, the password from secrets/smtp_password, as a real relay would.
  mailpit:
    <<: *hardened
    tmpfs:
      - /tmp:size=32m,uid=1000,gid=1000,mode=0770
    mem_limit: 48m
    image: axllent/mailpit:v1.34.0
    # Not root: the group the agent gives its key to (infra/tls/identities.conf).
    user: "1000:1000"
    # STARTTLS required on SMTP, HTTPS on the UI and API, restarted on each renewal (infra/mailpit/start.sh).
    entrypoint: ["/bin/sh", "/etc/freightflow/mailpit/start.sh"]
    environment:
      MP_MAX_MESSAGES: "5000"
      # Also read by the healthcheck's readyz, which then asks over HTTPS.
      MP_UI_TLS_CERT: /tls/cert.pem
      MP_UI_TLS_KEY: /tls/key.pem
    secrets: [smtp_password]
    volumes:
      - ./infra/mailpit:/etc/freightflow/mailpit:ro
      - type: volume
        source: certs
        target: /tls
        read_only: true
        volume:
          subpath: mailpit
    depends_on:
      cert-agent:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Stand-ins for the outside services (ADR 0034): the ECB's and the Bank of Namibia's rates as they answer, on today's
  # working days, with a /_control endpoint for the fire drill. CI points banking at it (ECB_BASE_URL, BON_RATES_URL),
  # so no CI job calls a live API; a local stack uses the real sources unless .env says otherwise.
  partner-simulator:
    <<: *hardened
    tmpfs:
      - /tmp:size=8m
    mem_limit: 48m
    image: python:3.15.2-alpine
    command: ["python", "-I", "/app/simulator.py"]
    # The image's root user is not needed: the group the agent gives its key to (infra/tls/identities.conf).
    user: "1000:1000"
    volumes:
      - ./infra/partners:/app:ro
      # Its certificate for its own HTTPS and the internal CA's root, for the carrier's pushes to the gateway (ADR 0040).
      - type: volume
        source: certs
        target: /tls
        read_only: true
        volume:
          subpath: partner-simulator
    depends_on:
      cert-agent:
        condition: service_healthy
    environment:
      ECB_LAG_WORKING_DAYS: ${SIMULATOR_ECB_LAG_WORKING_DAYS:-0}
      BON_FACTOR: ${SIMULATOR_BON_FACTOR:-1.0016}
      # A carrier in DCSA Track and Trace 2.2 (ADR 0037): pushes signed notifications through the gateway, as a real
      # carrier would, and serves /carrier/v2/events for polling.
      CARRIER_CALLBACK_URL: https://api-gateway:8080/api/v1/dcsa/notifications/carrier-kalahari-freight
      CARRIER_SECRET_FILE: /run/secrets/dcsa_carrier_secret
    secrets: [dcsa_carrier_secret]
    healthcheck:
      test: ["CMD", "python", "-c", "import ssl, urllib.request; urllib.request.urlopen('https://localhost:8090/health',
             timeout=2, context=ssl.create_default_context(cafile='/tls/ca.pem'))"]
      interval: 5s
      timeout: 5s
      retries: 12

  notification-service:
    <<: *hardened
    tmpfs:
      - /tmp:size=64m
    mem_limit: 384m
    build: ./notification-service
    environment:
      # OpenTelemetry (ADR 0030): exported only with infra/observability/observability.env (the otlp profile).
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}
      OTLP_ENDPOINT: ${OTLP_ENDPOINT:-https://otel-collector:4318}
      SERVICE_VERSION: ${SERVICE_VERSION:-dev}
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-local}
      # Heap 45% of the 384m limit; the rest is metaspace, code cache, thread stacks and buffers (ADR 0029).
      JAVA_OPTS: >-
        -XX:MaxRAMPercentage=45 -XX:InitialRAMPercentage=20 -XX:MaxMetaspaceSize=192m -Xss512k
        -XX:+ExitOnOutOfMemoryError ${JAVA_GC:--XX:+UseSerialGC}
      NOTIFICATION_DB_URL: jdbc:postgresql://notification-db:5432/notification?sslmode=verify-full&sslrootcert=/tls/ca.pem
      NOTIFICATION_DB_USER: ${NOTIFICATION_DB_USER:?set in .env}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_PUBLIC_URL:-https://127.0.0.1:8080}/realms/freightflow
      KEYCLOAK_JWK_SET_URI: https://keycloak:8443/realms/freightflow/protocol/openid-connect/certs
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_USERNAME: notification
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      # STARTTLS required, Mailpit verified against the internal root by name (ADR 0040).
      SMTP_STARTTLS: "true"
      SMTP_USERNAME: freightflow
    secrets:
      # The owner's password runs the migrations; the service connects as notification_app (ADR 0041).
      - notification_db_password
      - notification_db_app_password
      - db_monitoring_password
      - smtp_password
      - source: kafka_notification_password
        target: kafka_password
    volumes:
      - type: volume
        source: certs
        target: /tls
        read_only: true
        volume:
          subpath: notification-service
    depends_on:
      cert-agent:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
      notification-db:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      # Mutual TLS on its one port (ADR 0040): the healthcheck presents the service's own certificate.
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "--cacert", "/tls/ca.pem", "--cert", "/tls/cert.pem",
             "--key", "/tls/key.pem", "https://localhost:8083/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      # As banking and logistics: a first start of the whole stack took up to 395 s on the benchmark laptop.
      start_period: 420s
      start_interval: 3s

  # ---------------- Observability (--profile observability, ADR 0032) ----------------
  #   docker compose --env-file .env --env-file infra/observability/observability.env --profile observability up -d
  # The services send traces and logs to the collector, never to a backend (ADR 0031); Prometheus scrapes their
  # metrics. Grafana on 127.0.0.1:3000; Prometheus, Tempo, Loki and Alertmanager on 127.0.0.1 for the CI checks.
  otel-collector:
    profiles: [observability]
    <<: *hardened
    tmpfs:
      - /tmp:size=16m
    image: otel/opentelemetry-collector-contrib:0.165.0
    command: ["--config=/etc/otelcol/config.yaml"]
    mem_limit: 192m
    networks: [default, docker-api]
    environment:
      GOMEMLIMIT: 150MiB
      TAIL_SAMPLING_PERCENTAGE: ${TAIL_SAMPLING_PERCENTAGE:-100}
    # The monitoring role in each database (pg_monitor, ADR 0041), not the services' own users.
    secrets: [db_monitoring_password, kafka_monitoring_password]
    volumes:
      - ./infra/observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
      - type: volume
        source: certs
        target: /tls
        read_only: true
        volume:
          subpath: otel-collector
      # Every certificate the agent issued, without keys, for tls_check (CertificateNotRenewed).
      - type: volume
        source: certs
        target: /certs
        read_only: true
        volume:
          subpath: public
    depends_on:
      # Its certificate directories (subpaths of the certs volume) exist once the agent has issued them.
      cert-agent:
        condition: service_healthy
      # The monitoring user exists only once kafka-init has run; a first login that fails is not retried by the
      # kafka_metrics receiver's client.
      kafka-init:
        condition: service_completed_successfully
      banking-db:
        condition: service_healthy
      logistics-db:
        condition: service_healthy
      notification-db:
        condition: service_healthy
      tempo:
        condition: service_started
      loki:
        condition: service_started
      prometheus:
        condition: service_started

  # The Docker API for the collector's docker_stats receiver, through HAProxy: GET only, and only the paths it reads
  # (infra/docker-api/haproxy.cfg). The collector never holds the socket, which would give it the host (ADR 0041).
  docker-api:
    profiles: [observability]
    <<: *hardened
    tmpfs:
      - /tmp:size=1m
      - /var/run:size=1m
    image: haproxy:3.4.8-alpine
    # The host's socket belongs to its root; read as its owner, with no capability.
    user: "0"
    mem_limit: 32m
    volumes:
      - ./infra/docker-api/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [docker-api]

  tempo:
    profiles: [observability]
    <<: *hardened
    tmpfs:
      - /tmp:size=64m
    image: grafana/tempo:3.1.1
    command: ["-target=all", "-config.file=/etc/tempo.yaml"]
    mem_limit: 384m
    volumes:
      - ./infra/observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "127.0.0.1:3200:3200"

  loki:
    profiles: [observability]
    <<: *hardened
    tmpfs:
      - /tmp:size=64m
    image: grafana/loki:3.7.10
    command: ["-config.file=/etc/loki/config.yaml"]
    mem_limit: 256m
    volumes:
      - ./infra/observability/loki.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    ports:
      - "127.0.0.1:3100:3100"

  prometheus:
    profiles: [observability]
    <<: *hardened
    tmpfs:
      - /tmp:size=16m
    image: prom/prometheus:v3.16.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      # The collector's infrastructure metrics and Tempo's span metrics arrive by remote write.
      - --web.enable-remote-write-receiver
      # Exemplars: a latency bucket keeps the trace id of a request that landed in it (ADR 0031).
      - --enable-feature=exemplar-storage
    mem_limit: 384m
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/observability/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
      # Its client certificate for the services' mutual TLS and the internal CA's root (ADR 0039, ADR 0040).
      - type: volume
        source: certs
        target: /tls
        read_only: true
        volume:
          subpath: prometheus
    depends_on:
      # Its directory of the certs volume exists once the agent has issued its certificate: a subpath must exist when
      # the container is created.
      cert-agent:
        condition: service_healthy
    ports:
      - "127.0.0.1:9090:9090"

  alertmanager:
    profiles: [observability]
    <<: *hardened
    tmpfs:
      - /tmp:size=8m
    image: prom/alertmanager:v0.35.0
    command: ["--config.file=/etc/alertmanager/alertmanager.yml", "--storage.path=/alertmanager"]
    mem_limit: 64m
    secrets: [smtp_password]
    volumes:
      - ./infra/observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      # The internal CA's root: its emails go to Mailpit over STARTTLS (ADR 0040).
      - type: volume
        source: certs
        target: /tls
        read_only: true
        volume:
          subpath: trust
    depends_on:
      cert-agent:
        condition: service_healthy
    ports:
      - "127.0.0.1:9093:9093"

  grafana:
    profiles: [observability]
    <<: *hardened
    tmpfs:
      - /tmp:size=32m
      - /var/lib/grafana:size=64m,uid=472,gid=0,mode=0770
    image: grafana/grafana:13.3.1
    # 13.3.1 peaked at 255.9 of 256 MiB in CI and was OOM-killed at start (ADR 0032).
    mem_limit: 384m
    environment:
      # Local profile: anyone on 127.0.0.1 may look and explore (every panel links to Explore), nothing is saved:
      # the dashboards are provisioned files that the UI cannot overwrite.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_VIEWERS_CAN_EDIT: "true"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      # No plugin downloads at start: the dashboards use none, and /var/lib/grafana is a small tmpfs (ADR 0041).
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      prometheus:
        condition: service_started
      tempo:
        condition: service_started
      loki:
        condition: service_started

secrets:
  # Generated by scripts/generate_secrets.py into secrets/ (git-ignored).
  banking_db_password:
    file: ./secrets/banking_db_password
  banking_db_app_password:
    file: ./secrets/banking_db_app_password
  logistics_db_app_password:
    file: ./secrets/logistics_db_app_password
  notification_db_app_password:
    file: ./secrets/notification_db_app_password
  db_monitoring_password:
    file: ./secrets/db_monitoring_password
  logistics_db_password:
    file: ./secrets/logistics_db_password
  keycloak_db_password:
    file: ./secrets/keycloak_db_password
  logistics_client_secret:
    file: ./secrets/logistics_client_secret
  kafka_admin_password:
    file: ./secrets/kafka_admin_password
  kafka_banking_password:
    file: ./secrets/kafka_banking_password
  kafka_logistics_password:
    file: ./secrets/kafka_logistics_password
  kafka_notification_password:
    file: ./secrets/kafka_notification_password
  notification_db_password:
    file: ./secrets/notification_db_password
  smtp_password:
    file: ./secrets/smtp_password
  kafka_monitoring_password:
    file: ./secrets/kafka_monitoring_password
  dcsa_carrier_secret:
    file: ./secrets/dcsa_carrier_secret
  ca_password:
    file: ./secrets/ca_password

networks:
  # Only the collector and the Docker API proxy (ADR 0041).
  docker-api:
    internal: true

volumes:
  ca-data:
  certs:
  banking-db-data:
  logistics-db-data:
  keycloak-db-data:
  kafka-data:
  notification-db-data:
  tempo-data:
  loki-data:
  prometheus-data:
