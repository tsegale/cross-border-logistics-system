server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          # Defaults reach services started from the IDE; compose points them at the containers.
          routes:
            - id: banking
              uri: ${BANKING_SERVICE_URI:http://127.0.0.1:8081}
              predicates:
                - Path=/api/v1/accounts/**,/api/v1/transfers/**,/api/v1/fx-quotes/**,/api/v1/journal-entries/**,/api/v1/ledger/**,/docs/banking/**
              filters:
                - PreserveHostHeader
            - id: logistics
              uri: ${LOGISTICS_SERVICE_URI:http://127.0.0.1:8082}
              predicates:
                - Path=/api/v1/quotes/**,/api/v1/shipments/**,/docs/logistics/**
              filters:
                - PreserveHostHeader

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  structured:
    format:
      console: ecs
    ecs:
      service:
        name: ${spring.application.name}
        version: ${SERVICE_VERSION:0.1.0}
