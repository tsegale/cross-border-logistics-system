server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          # Edge policy (ADR 0015): connect 2 s; 15 s for an answer, longer than the ledger's 10 s account-lock
          # timeout, so a lock-timeout 503 from banking is not cut off by the gateway.
          httpclient:
            connect-timeout: ${GATEWAY_CONNECT_TIMEOUT_MS:2000}
            response-timeout: ${GATEWAY_RESPONSE_TIMEOUT:15s}
          default-filters:
            # Only idempotent reads are retried at the edge. A POST is never retried here, even with an
            # Idempotency-Key: the client owns that retry.
            - name: Retry
              args:
                retries: 2
                methods: GET,HEAD
                series: []
                statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT
                exceptions: java.io.IOException,java.util.concurrent.TimeoutException
                backoff:
                  firstBackoff: 50ms
                  maxBackoff: 500ms
                  factor: 2
                  basedOnPreviousValue: false
          # Defaults reach services started from the IDE; compose points them at the containers.
          routes:
            - id: banking
              uri: ${BANKING_SERVICE_URI:http://127.0.0.1:8081}
              predicates:
                - Path=/api/v1/accounts/**,/api/v1/transfers/**,/api/v1/fx-quotes/**,/api/v1/fx-rates/**,/api/v1/journal-entries/**,/api/v1/ledger/**,/docs/banking/**
              filters:
                - PreserveHostHeader
            - id: logistics
              uri: ${LOGISTICS_SERVICE_URI:http://127.0.0.1:8082}
              predicates:
                - Path=/api/v1/quotes/**,/api/v1/shipments/**,/docs/logistics/**
              filters:
                - PreserveHostHeader

freightflow:
  gateway:
    max-request-size: ${GATEWAY_MAX_REQUEST_SIZE:1MB}
    # Answered 404 at the edge whatever the routes say (ADR 0015).
    internal-path-prefixes: /api/v1/holds,/api/v1/payment-commands

management:
  # Health and metrics on their own port, published on 127.0.0.1 only; /actuator on 8080 is a 404 (ADR 0015).
  server:
    port: ${MANAGEMENT_PORT:8085}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  structured:
    format:
      console: ecs
    ecs:
      service:
        name: ${spring.application.name}
        version: ${SERVICE_VERSION:0.1.0}
