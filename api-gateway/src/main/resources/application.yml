server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  # MDC (trace ids, request id) follows a request through Reactor's threads (ADR 0030).
  reactor:
    context-propagation: auto
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      # Bounds what a slow Redis adds to a money-moving request; a Redis that is down is rejected at once.
      timeout: ${REDIS_TIMEOUT:1s}
  cloud:
    gateway:
      server:
        webflux:
          # Edge policy (ADR 0015): connect 2 s; 15 s for an answer, longer than the ledger's 10 s account-lock
          # timeout, so a lock-timeout 503 from banking is not cut off by the gateway.
          httpclient:
            connect-timeout: ${GATEWAY_CONNECT_TIMEOUT_MS:2000}
            response-timeout: ${GATEWAY_RESPONSE_TIMEOUT:15s}
          default-filters:
            # Only idempotent reads are retried at the edge. A POST is never retried here, even with an
            # Idempotency-Key: the client owns that retry.
            - name: Retry
              args:
                retries: 2
                methods: GET,HEAD
                series: []
                statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT
                exceptions: java.io.IOException,java.util.concurrent.TimeoutException
                backoff:
                  firstBackoff: 50ms
                  maxBackoff: 500ms
                  factor: 2
                  basedOnPreviousValue: false
          # Defaults reach services started from the IDE; compose points them at the containers.
          routes:
            # Money-moving requests (ADR 0017): a per-caller token bucket that fails closed if Redis is down.
            - id: money-banking
              order: 0
              uri: ${BANKING_SERVICE_URI:http://127.0.0.1:8081}
              predicates:
                - Path=/api/v1/transfers,/api/v1/approvals,/api/v1/approvals/*/approval,/api/v1/fx-quotes
                - Method=POST
              filters:
                - PreserveHostHeader
                - name: RateLimit
                  args:
                    fail-mode: closed
                    redis-rate-limiter.replenishRate: ${RATE_LIMIT_MONEY_RPS:5}
                    redis-rate-limiter.burstCapacity: ${RATE_LIMIT_MONEY_BURST:20}
            # Booking reserves money: the AUTHORISE hold (ADR 0012).
            - id: money-bookings
              order: 0
              uri: ${LOGISTICS_SERVICE_URI:http://127.0.0.1:8082}
              predicates:
                - Path=/api/v1/shipments
                - Method=POST
              filters:
                - PreserveHostHeader
                - name: RateLimit
                  args:
                    fail-mode: closed
                    redis-rate-limiter.replenishRate: ${RATE_LIMIT_BOOKING_RPS:2}
                    redis-rate-limiter.burstCapacity: ${RATE_LIMIT_BOOKING_BURST:10}
            - id: banking
              order: 10
              uri: ${BANKING_SERVICE_URI:http://127.0.0.1:8081}
              predicates:
                - Path=/api/v1/accounts/**,/api/v1/transfers/**,/api/v1/fx-quotes/**,/api/v1/fx-rates/**,/api/v1/journal-entries/**,/api/v1/approvals/**,/api/v1/ledger/**,/api/v1/reference-rates/**,/docs/banking/**
              filters:
                - PreserveHostHeader
            - id: logistics
              order: 10
              uri: ${LOGISTICS_SERVICE_URI:http://127.0.0.1:8082}
              predicates:
                # Payment commands: operators retry parked ones (ADR 0012), auditors read them (ADR 0018).
                # Its consumers' dead letters (ADR 0026): /api/v1/dead-letters is notification-service's.
                # Carriers' DCSA Track and Trace notifications (ADR 0037), signed rather than authenticated by token.
                - Path=/api/v1/quotes/**,/api/v1/shipments/**,/api/v1/payment-commands/**,/api/v1/logistics/dead-letters,/api/v1/logistics/dead-letters/**,/api/v1/dcsa/notifications/*,/docs/logistics/**
              filters:
                - PreserveHostHeader
            # Emails (ADR 0027): an organisation's settings and history, operators' resends and dead letters.
            - id: notification
              order: 10
              uri: ${NOTIFICATION_SERVICE_URI:http://127.0.0.1:8083}
              predicates:
                - Path=/api/v1/notification-settings,/api/v1/notifications,/api/v1/notifications/**,/api/v1/dead-letters,/api/v1/dead-letters/**
              filters:
                - PreserveHostHeader

freightflow:
  gateway:
    max-request-size: ${GATEWAY_MAX_REQUEST_SIZE:1MB}
    # Answered 404 at the edge whatever the routes say (ADR 0015): only logistics-service may hold money (ADR 0019).
    internal-path-prefixes: /api/v1/holds
  # Before readiness: signing keys, Redis, every route's service and its own port (WarmUpRunner).
  warm-up:
    enabled: ${WARM_UP_ENABLED:true}
    rounds: 3
    request-timeout: 5s
    timeout: 60s
    paths:
      - "/api/v1/accounts"
      - "/api/v1/shipments"
      - "/api/v1/approvals"
  # Who signs the tokens (ADR 0016, ADR 0017). No default issuer: the gateway does not start without one.
  security:
    issuer-uri: ${KEYCLOAK_ISSUER_URI:}
    jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:}
    audience: api-gateway

management:
  # OpenTelemetry (ADR 0030). Every trace is kept by the service: sampling is the collector's (tail-based, ADR 0031).
  # Nothing is exported unless the otlp profile is on (application-otlp.yml, the observability compose profile);
  # trace and span ids still reach the logs and the outbox rows without it.
  tracing:
    sampling:
      probability: 1.0
    export:
      otlp:
        enabled: false
  logging:
    export:
      otlp:
        enabled: false
  # Latency histograms for the RED dashboards and the SLOs, with a bucket on each threshold (docs/slo.md). Exemplars
  # link a bucket to a trace that landed in it (ADR 0031).
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        spring.cloud.gateway.requests: true
      slo:
        http.server.requests: 100ms,250ms,500ms,1s,2s
        spring.cloud.gateway.requests: 100ms,250ms,500ms,1s,2s
  # Metrics are scraped from /actuator/prometheus (with exemplars), not pushed over OTLP.
  otlp:
    metrics:
      export:
        enabled: false
  opentelemetry:
    tracing:
    # The edge decides for the whole trace, whatever sampled flag a caller sends (ADR 0030).
      sampler: always-on
    resource-attributes:
      service.version: ${SERVICE_VERSION:dev}
      deployment.environment.name: ${DEPLOYMENT_ENVIRONMENT:local}
  # Health and metrics on their own port, published on 127.0.0.1 only; /actuator on 8080 is a 404 (ADR 0015).
  server:
    port: ${MANAGEMENT_PORT:8085}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  structured:
    format:
      console: ecs
    ecs:
      service:
        name: ${spring.application.name}
        version: ${SERVICE_VERSION:dev}
    # The OpenTelemetry names, so a log line and its trace find each other in Grafana (ADR 0030).
    json:
      rename:
        traceId: trace_id
        spanId: span_id
