server:
  port: ${SERVER_PORT:8082}
  shutdown: graceful
  forward-headers-strategy: framework

spring:
  # Compose secrets are files under /run/secrets; each file name becomes a property (ADR 0019).
  config:
    import: optional:configtree:/run/secrets/
  # logistics-service's own token for banking: client credentials, scope banking.holds (ADR 0019). The secret comes
  # from a file (compose secret logistics_client_secret, read through the config tree), never from this file.
  security:
    oauth2:
      client:
        registration:
          banking:
            provider: keycloak
            client-id: logistics-service
            client-secret: ${logistics_client_secret:${KEYCLOAK_LOGISTICS_CLIENT_SECRET:}}
            authorization-grant-type: client_credentials
            scope: banking.holds
        provider:
          keycloak:
            token-uri: ${KEYCLOAK_TOKEN_URI:http://127.0.0.1:8180/realms/freightflow/protocol/openid-connect/token}
  application:
    name: logistics-service
  datasource:
    # Defaults match docker compose's published port, so the service also runs from the IDE.
    url: ${LOGISTICS_DB_URL:jdbc:postgresql://127.0.0.1:5442/logistics}
    username: ${LOGISTICS_DB_USER:logistics}
    # From the compose secret logistics_db_password (config tree below) or the environment; no default (ADR 0019).
    password: ${logistics_db_password:${LOGISTICS_DB_PASSWORD:}}
    # With the database down, fail a request in about 2 s instead of Hikari's default 30 s.
    hikari:
      connection-timeout: ${LOGISTICS_DB_CONNECTION_TIMEOUT:2000}
      maximum-pool-size: ${LOGISTICS_DB_MAX_POOL_SIZE:32}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks that the entities match it.
      ddl-auto: validate
  # Its own SCRAM user on the broker; the ACLs let it write only its own topics (ADR 0022).
  kafka:
    # Producer and consumer spans, with traceparent in the record headers (ADR 0030).
    template:
      observation-enabled: true
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}
    security:
      protocol: SASL_PLAINTEXT
    properties:
      sasl.mechanism: SCRAM-SHA-512
      sasl.jaas.config: org.apache.kafka.common.security.scram.ScramLoginModule required username="${KAFKA_USERNAME:logistics}" password="${freightflow.kafka.password}";
    admin:
      # The service starts without the broker (events wait in the outbox); a slow broker delays it at most this long.
      operation-timeout: 10s
    # banking's hold events (ADR 0028), as group logistics-service. Offsets are committed after each record; the
    # processed-events table makes a redelivery harmless (ADR 0026).
    consumer:
      group-id: logistics-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        partition.assignment.strategy: org.apache.kafka.clients.consumer.CooperativeStickyAssignor
    listener:
      observation-enabled: true
      ack-mode: record
    # Only the outbox relay and dead-lettering produce (ADR 0025). Idempotent with acks=all: a retry inside the client never writes
    # an event twice, and an acknowledged event is on every in-sync replica.
    producer:
      acks: all
      # lz4 is pure Java; zstd would need a native library the Alpine runtime image may not load.
      compression-type: lz4
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        linger.ms: 5
        # Waiting for metadata of a topic the broker does not know (or a broker that is down) ends the send.
        max.block.ms: 5000
        request.timeout.ms: 10000
        # Within the relay's send-timeout (30 s), which is within its lease (60 s).
        delivery.timeout.ms: 25000
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true
  http:
    serviceclient:
      # banking-service owns accounts, holds and FX (ADR 0001); timeouts and resilience in ADR 0013.
      banking:
        base-url: ${BANKING_SERVICE_URI:http://127.0.0.1:8081}
        connect-timeout: ${BANKING_CONNECT_TIMEOUT:500ms}
        read-timeout: ${BANKING_READ_TIMEOUT:2s}
  task:
    scheduling:
      pool:
        # The event relay can wait up to the admin timeout for a broker that is down; the sweepers keep running.
        size: 4
      thread-name-prefix: logistics-sched-

freightflow:
  # Transactional outbox and relay for shipment events (ADR 0025); defaults in OutboxProperties.
  events:
    outbox:
      relay-enabled: ${EVENT_RELAY_ENABLED:true}
      relay-interval: ${EVENT_RELAY_INTERVAL:200ms}
      retention: ${EVENT_OUTBOX_RETENTION:7d}
  # Before readiness: signing keys, a query per entity, its own port and one call to banking (WarmUpRunner).
  warm-up:
    enabled: ${WARM_UP_ENABLED:true}
    rounds: 3
    request-timeout: 5s
    timeout: 60s
    # Banking and Keycloak first, up to this, before the 60 s above start (a cold start of the whole stack).
    dependency-timeout: ${WARM_UP_DEPENDENCY_TIMEOUT:4m}
    paths:
      - "/api/v1/shipments"
      - "/api/v1/quotes"
      - "/api/v1/payment-commands"
  # Who signs the tokens logistics accepts (ADRs 0016, 0017). No default issuer: logistics does not start without one.
  kafka:
    # From the compose secret kafka_password (its own, ADR 0022) or the environment; no default (ADR 0019).
    password: ${kafka_password:${KAFKA_PASSWORD:}}
    # 1 on the single local broker; 3 in a real cluster, with min.insync.replicas 2.
    replication-factor: ${KAFKA_REPLICATION_FACTOR:1}
  security:
    issuer-uri: ${KEYCLOAK_ISSUER_URI:}
    jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:}
    audience: logistics-service
  logistics:
    # Carrier events in DCSA Track and Trace 2.2 (ADR 0037). Each carrier pushes under its subscription, signed with
    # its secret (compose secret dcsa_carrier_secret, ADR 0019); a POLL carrier is also fetched from its API.
    dcsa:
      replay-window: ${DCSA_REPLAY_WINDOW:24h}
      clock-skew: 5m
      process-interval: 500ms
      carriers:
        carrier-kalahari-freight:
          subscription-id: ${DCSA_KALAHARI_SUBSCRIPTION_ID:6f2d0a6e-1c1d-4f53-9a64-1c4e8f0b7a21}
          secret: ${dcsa_carrier_secret:${DCSA_CARRIER_SECRET:}}
          mode: ${DCSA_KALAHARI_MODE:PUSH}
          base-url: ${DCSA_KALAHARI_API_URL:http://127.0.0.1:8090/carrier}
    supported-currencies: ${LOGISTICS_SUPPORTED_CURRENCIES:NAD,ZAR,EUR}
    quote-validity: ${LOGISTICS_QUOTE_VALIDITY:24h}
    # Payment saga relay (ADR 0012)
    payments:
      relay-enabled: ${PAYMENT_RELAY_ENABLED:true}
      relay-interval: ${PAYMENT_RELAY_INTERVAL:500ms}
      batch-size: ${PAYMENT_RELAY_BATCH:20}
      lease: ${PAYMENT_RELAY_LEASE:30s}
      max-attempts: ${PAYMENT_MAX_ATTEMPTS:8}
      retry-backoff: ${PAYMENT_RETRY_BACKOFF:1s}
      max-retry-backoff: ${PAYMENT_MAX_RETRY_BACKOFF:5m}
      # Commands of a batch sent at once; the payments bulkhead allows the same number (ADR 0013)
      parallelism: ${PAYMENT_RELAY_PARALLELISM:8}
      # How long holds last: until after the planned pickup, extended while the shipment waits (ADR 0011)
      hold-expiry:
        margin: ${HOLD_EXPIRY_MARGIN:3d}
        # Below banking's holds.max-ttl (30d), so clock skew never gets an expiry refused
        max-ttl: ${HOLD_EXPIRY_MAX_TTL:29d}
        renew-before: ${HOLD_RENEW_BEFORE:3d}
        overdue-extension: ${HOLD_OVERDUE_EXTENSION:7d}
        # With the margin, inside banking's holds.max-lifetime (120d)
        max-pickup-horizon: ${MAX_PICKUP_HORIZON:90d}
        renewal-enabled: ${HOLD_RENEWAL_ENABLED:true}
        renewal-interval: ${HOLD_RENEWAL_INTERVAL:1h}
        renewal-batch: ${HOLD_RENEWAL_BATCH:100}
    # In-call retries for payment commands to banking (ADR 0013)
    banking:
      retry:
        max-retries: ${BANKING_RETRY_MAX:2}
        delay: ${BANKING_RETRY_DELAY:100ms}
        multiplier: 2
        jitter: ${BANKING_RETRY_JITTER:50ms}
        max-delay: ${BANKING_RETRY_MAX_DELAY:400ms}
        budget: ${BANKING_CALL_BUDGET:5s}
    idempotency:
      ttl: ${IDEMPOTENCY_TTL:24h}
      cleanup-interval: ${IDEMPOTENCY_CLEANUP_INTERVAL:15m}
      lock-timeout: ${IDEMPOTENCY_LOCK_TIMEOUT:5s}

# Circuit breaker and bulkheads around banking-service (ADR 0013)
resilience4j:
  circuitbreaker:
    instances:
      banking:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        slow-call-duration-threshold: ${BANKING_SLOW_CALL_THRESHOLD:2s}
        slow-call-rate-threshold: 50
        wait-duration-in-open-state: ${BANKING_BREAKER_OPEN_WAIT:10s}
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        # A business refusal (4xx) is banking working, not failing; a full bulkhead never reached banking.
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException
          - io.github.resilience4j.bulkhead.BulkheadFullException
        # Neither is banking refusing to price on a stale reference rate (ADR 0034).
        ignore-exception-predicate: com.freightflow.logistics.banking.FxRatesStale
      # The poll of a carrier's DCSA events (ADR 0037): a few failures in a row stop it until the carrier is back.
      dcsa-poll:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 5
        minimum-number-of-calls: 3
        failure-rate-threshold: 50
        wait-duration-in-open-state: ${DCSA_POLL_BREAKER_OPEN_WAIT:2m}
        permitted-number-of-calls-in-half-open-state: 1
        automatic-transition-from-open-to-half-open-enabled: true
  bulkhead:
    instances:
      banking-payments:
        max-concurrent-calls: ${BANKING_PAYMENTS_CONCURRENCY:8}
        max-wait-duration: 0
      banking-fx:
        max-concurrent-calls: ${BANKING_FX_CONCURRENCY:4}
        max-wait-duration: 0

# Served under the path the gateway publishes them at, so Swagger UI works through the gateway unchanged.
springdoc:
  api-docs:
    path: /docs/logistics/v3/api-docs
  swagger-ui:
    path: /docs/logistics/swagger-ui.html
  default-produces-media-type: application/json

management:
  # OpenTelemetry (ADR 0030). Every trace is kept by the service: sampling is the collector's (tail-based, ADR 0031).
  # Nothing is exported unless the otlp profile is on (application-otlp.yml, the observability compose profile);
  # trace and span ids still reach the logs and the outbox rows without it.
  tracing:
    sampling:
      probability: 1.0
    export:
      otlp:
        enabled: false
  logging:
    export:
      otlp:
        enabled: false
  # Latency histograms for the RED dashboards and the SLOs, with a bucket on each threshold (docs/slo.md). Exemplars
  # link a bucket to a trace that landed in it (ADR 0031).
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        freightflow.outbox.lag: true
      slo:
        http.server.requests: 100ms,250ms,500ms,1s,2s
  # Metrics are scraped from /actuator/prometheus (with exemplars), not pushed over OTLP.
  otlp:
    metrics:
      export:
        enabled: false
  opentelemetry:
    tracing:
    # Follows the gateway's decision, which is to keep everything (ADR 0030).
      sampler: parent-based-always-on
    resource-attributes:
      service.version: ${SERVICE_VERSION:dev}
      deployment.environment.name: ${DEPLOYMENT_ENVIRONMENT:local}
  endpoints:
    web:
      exposure:
        # prometheus is for scraping on the internal network: the gateway routes no /actuator path here.
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

# JSON on stdout.
logging:
  level:
    # The Kafka clients log their whole configuration at INFO on every connect.
    org.apache.kafka: WARN
  structured:
    format:
      console: ecs
    ecs:
      service:
        name: ${spring.application.name}
        version: ${SERVICE_VERSION:dev}
    # The OpenTelemetry names, so a log line and its trace find each other in Grafana (ADR 0030).
    json:
      rename:
        traceId: trace_id
        spanId: span_id
