server:
  port: ${SERVER_PORT:8082}
  shutdown: graceful
  forward-headers-strategy: framework

spring:
  # Compose secrets are files under /run/secrets; each file name becomes a property (ADR 0019).
  config:
    import: optional:configtree:/run/secrets/
  # logistics-service's own token for banking: client credentials, scope banking.holds (ADR 0019). The secret comes
  # from a file (compose secret logistics_client_secret, read through the config tree), never from this file.
  security:
    oauth2:
      client:
        registration:
          banking:
            provider: keycloak
            client-id: logistics-service
            client-secret: ${logistics_client_secret:${KEYCLOAK_LOGISTICS_CLIENT_SECRET:}}
            authorization-grant-type: client_credentials
            scope: banking.holds
        provider:
          keycloak:
            token-uri: ${KEYCLOAK_TOKEN_URI:http://127.0.0.1:8180/realms/freightflow/protocol/openid-connect/token}
  application:
    name: logistics-service
  datasource:
    # Defaults match docker compose's published port, so the service also runs from the IDE.
    url: ${LOGISTICS_DB_URL:jdbc:postgresql://127.0.0.1:5442/logistics}
    username: ${LOGISTICS_DB_USER:logistics}
    # From the compose secret logistics_db_password (config tree below) or the environment; no default (ADR 0019).
    password: ${logistics_db_password:${LOGISTICS_DB_PASSWORD:}}
    # With the database down, fail a request in about 2 s instead of Hikari's default 30 s.
    hikari:
      connection-timeout: ${LOGISTICS_DB_CONNECTION_TIMEOUT:2000}
      maximum-pool-size: ${LOGISTICS_DB_MAX_POOL_SIZE:32}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks that the entities match it.
      ddl-auto: validate
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true
  http:
    serviceclient:
      # banking-service owns accounts, holds and FX (ADR 0001); timeouts and resilience in ADR 0013.
      banking:
        base-url: ${BANKING_SERVICE_URI:http://127.0.0.1:8081}
        connect-timeout: ${BANKING_CONNECT_TIMEOUT:500ms}
        read-timeout: ${BANKING_READ_TIMEOUT:2s}
  task:
    scheduling:
      pool:
        size: 2
      thread-name-prefix: logistics-sched-

freightflow:
  # Who signs the tokens logistics accepts (ADRs 0016, 0017). No default issuer: logistics does not start without one.
  security:
    issuer-uri: ${KEYCLOAK_ISSUER_URI:}
    jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:}
    audience: logistics-service
  logistics:
    supported-currencies: ${LOGISTICS_SUPPORTED_CURRENCIES:NAD,ZAR,EUR}
    quote-validity: ${LOGISTICS_QUOTE_VALIDITY:24h}
    # Payment saga relay (ADR 0012)
    payments:
      relay-enabled: ${PAYMENT_RELAY_ENABLED:true}
      relay-interval: ${PAYMENT_RELAY_INTERVAL:500ms}
      batch-size: ${PAYMENT_RELAY_BATCH:20}
      lease: ${PAYMENT_RELAY_LEASE:30s}
      max-attempts: ${PAYMENT_MAX_ATTEMPTS:8}
      retry-backoff: ${PAYMENT_RETRY_BACKOFF:1s}
      max-retry-backoff: ${PAYMENT_MAX_RETRY_BACKOFF:5m}
      # Commands of a batch sent at once; the payments bulkhead allows the same number (ADR 0013)
      parallelism: ${PAYMENT_RELAY_PARALLELISM:8}
      # How long holds last: until after the planned pickup, extended while the shipment waits (ADR 0011)
      hold-expiry:
        margin: ${HOLD_EXPIRY_MARGIN:3d}
        # Below banking's holds.max-ttl (30d), so clock skew never gets an expiry refused
        max-ttl: ${HOLD_EXPIRY_MAX_TTL:29d}
        renew-before: ${HOLD_RENEW_BEFORE:3d}
        overdue-extension: ${HOLD_OVERDUE_EXTENSION:7d}
        # With the margin, inside banking's holds.max-lifetime (120d)
        max-pickup-horizon: ${MAX_PICKUP_HORIZON:90d}
        renewal-enabled: ${HOLD_RENEWAL_ENABLED:true}
        renewal-interval: ${HOLD_RENEWAL_INTERVAL:1h}
        renewal-batch: ${HOLD_RENEWAL_BATCH:100}
    # In-call retries for payment commands to banking (ADR 0013)
    banking:
      retry:
        max-retries: ${BANKING_RETRY_MAX:2}
        delay: ${BANKING_RETRY_DELAY:100ms}
        multiplier: 2
        jitter: ${BANKING_RETRY_JITTER:50ms}
        max-delay: ${BANKING_RETRY_MAX_DELAY:400ms}
        budget: ${BANKING_CALL_BUDGET:5s}
    idempotency:
      ttl: ${IDEMPOTENCY_TTL:24h}
      cleanup-interval: ${IDEMPOTENCY_CLEANUP_INTERVAL:15m}
      lock-timeout: ${IDEMPOTENCY_LOCK_TIMEOUT:5s}

# Circuit breaker and bulkheads around banking-service (ADR 0013)
resilience4j:
  circuitbreaker:
    instances:
      banking:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        slow-call-duration-threshold: ${BANKING_SLOW_CALL_THRESHOLD:2s}
        slow-call-rate-threshold: 50
        wait-duration-in-open-state: ${BANKING_BREAKER_OPEN_WAIT:10s}
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        # A business refusal (4xx) is banking working, not failing; a full bulkhead never reached banking.
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException
          - io.github.resilience4j.bulkhead.BulkheadFullException
  bulkhead:
    instances:
      banking-payments:
        max-concurrent-calls: ${BANKING_PAYMENTS_CONCURRENCY:8}
        max-wait-duration: 0
      banking-fx:
        max-concurrent-calls: ${BANKING_FX_CONCURRENCY:4}
        max-wait-duration: 0

# Served under the path the gateway publishes them at, so Swagger UI works through the gateway unchanged.
springdoc:
  api-docs:
    path: /docs/logistics/v3/api-docs
  swagger-ui:
    path: /docs/logistics/swagger-ui.html
  default-produces-media-type: application/json

management:
  endpoints:
    web:
      exposure:
        # prometheus is for scraping on the internal network: the gateway routes no /actuator path here.
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

# JSON on stdout.
logging:
  structured:
    format:
      console: ecs
    ecs:
      service:
        name: ${spring.application.name}
        version: ${SERVICE_VERSION:0.1.0}
