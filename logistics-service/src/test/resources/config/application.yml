# Test-only additions, loaded on top of src/main/resources/application.yml. MockMvc tests build validated tokens
# with spring-security-test; logistics' own token for banking comes from a /token stub on the banking WireMock.
freightflow:
  # On only in WarmUpIntegrationTest: elsewhere its requests would land in the stubs' request journals.
  warm-up:
    enabled: false
  # Tests that publish drive EventRelay.relayOnce() themselves, so nothing races them for the outbox.
  events:
    outbox:
      relay-enabled: false
  # Testcontainers provides the connections; RequiredSecretsTest checks the real rule.
  secrets:
    required: false
  security:
    issuer-uri: http://keycloak.test/realms/freightflow
    jwk-set-uri: http://127.0.0.1:1/certs
spring:
  security:
    oauth2:
      client:
        registration:
          banking:
            client-secret: test-only-secret
# Spans reach TestSpans' in-memory exporter within 50 ms instead of the 5 s default (ADR 0030).
management:
  opentelemetry:
    tracing:
      export:
        schedule-delay: 50ms
