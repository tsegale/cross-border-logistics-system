# Client authentication for every FreightFlow database (ADR 0039).
# TCP connections must use TLS (hostssl) and a SCRAM password; a plaintext TCP connection matches the reject line.
# The Unix socket is inside the container only: whoever can reach it is already the server's user. The image's
# first-start initialisation and pg_isready use it, as the image's own default (trust) does.
# TYPE      DATABASE  USER  ADDRESS   METHOD
local       all       all             trust
hostssl     all       all   all       scram-sha-256
host        all       all   all       reject
