# Who may do what on the broker (ADR 0022). kafka-init applies this on every start; anything not listed is refused.
#
#   topic <name> <owner> [<consumer>:<group> ...]
#
# A topic or group name ending in * is a prefix (Kafka's PREFIXED resource pattern): it covers every name that starts
# with it. Retry topics and their consumer groups are named by Spring Kafka from the main ones (ADR 0026).
#
# The owner declares the topic (KafkaAdmin NewTopic) and is the only one that writes it: Create, Describe,
# DescribeConfigs, AlterConfigs, Write. Each consumer may Read and Describe the topic, and Read its own consumer group.
# One service, one principal: banking, logistics, notification. A fourth, monitoring, only describes the cluster,
# topics and groups for consumer lag (init.sh, ADR 0031).

topic freightflow.account.v1       banking
topic freightflow.journal-entry.v1 banking
topic freightflow.hold.v1          banking    logistics:logistics-service notification:notification-service*
topic freightflow.approval.v1      banking
topic freightflow.shipment.v1      logistics  notification:notification-service*

# Dead letters of a consumer (ADR 0026): <topic>.<group>.dlt, owned by the consumer that writes them.
topic freightflow.hold.v1.logistics-service.dlt logistics

# notification-service's retry topics and dead letters (@RetryableTopic): it writes and reads them itself.
topic freightflow.hold.v1.notification-service*     notification notification:notification-service*
topic freightflow.shipment.v1.notification-service* notification notification:notification-service*
