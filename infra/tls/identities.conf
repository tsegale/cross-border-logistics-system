# Every certificate the internal CA issues (ADR 0039), one per line:
#   <identity> <gid that reads the key> <subject alternative names, comma-separated>
# The identity is the certificate's common name and its first DNS name; services that take mTLS accept a caller by
# it. The gid is the group of the container user that reads the key (the key is 0640, owned by the agent, that group).
# The agent renews each at two thirds of its 24 h lifetime.

# Services: server certificates for their own port, client certificates for the calls they make.
api-gateway            10001  api-gateway,localhost,127.0.0.1
banking-service        10001  banking-service,localhost,127.0.0.1
logistics-service      10001  logistics-service,localhost,127.0.0.1
notification-service   10001  notification-service,localhost,127.0.0.1

# Infrastructure: server certificates. Postgres copies its key to a 0600 file of its own (it refuses group read).
banking-db             70     banking-db,localhost
logistics-db           70     logistics-db,localhost
notification-db        70     notification-db,localhost
keycloak-db            70     keycloak-db,localhost
keycloak               1000   keycloak,localhost,127.0.0.1
kafka                  1000   kafka,localhost
redis                  1000   redis,localhost
mailpit                1000   mailpit,localhost
partner-simulator      1000   partner-simulator,localhost
otel-collector         10001  otel-collector,localhost
