# OpenTelemetry Collector (contrib) in front of the backends (ADR 0031): the services send traces and logs here over
# OTLP and never to Tempo or Loki themselves. It also reads what no service can report about itself: Postgres,
# Kafka consumer lag, Redis and each container's memory against its limit.
#
#   services --OTLP--> otlp receiver --> memory_limiter --> redaction --> tail_sampling --> batch --> Tempo
#                                                       \-> redaction --> transform(log bodies) --> batch --> Loki
#   postgresql, kafka_metrics, redis, docker_stats, tls_check --> batch --> Prometheus (remote write)
#
# The services' own metrics (RED, JVM, Hikari, business gauges) are scraped by Prometheus from /actuator/prometheus
# directly, which keeps their exemplars (ADR 0031).

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  # TLS with the agent's certificate, re-read every minute (it is renewed every 16 h); the services verify it against
  # the internal root by name (ADR 0040).
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        tls:
          cert_file: /tls/cert.pem
          key_file: /tls/key.pem
          min_version: "1.2"
          reload_interval: 1m
      http:
        endpoint: 0.0.0.0:4318
        tls:
          cert_file: /tls/cert.pem
          key_file: /tls/key.pem
          min_version: "1.2"
          reload_interval: 1m

  # One receiver per database, each as that service's own user: the collector needs no superuser. TLS with the
  # internal CA's root, verified against the endpoint's host name: the databases refuse plaintext (ADR 0039).
  postgresql/banking:
    endpoint: banking-db:5432
    transport: tcp
    username: ${env:BANKING_DB_USER}
    password: ${file:/run/secrets/banking_db_password}
    databases: [banking]
    collection_interval: 15s
    tls:
      ca_file: /tls/ca.pem
  postgresql/logistics:
    endpoint: logistics-db:5432
    transport: tcp
    username: ${env:LOGISTICS_DB_USER}
    password: ${file:/run/secrets/logistics_db_password}
    databases: [logistics]
    collection_interval: 15s
    tls:
      ca_file: /tls/ca.pem
  postgresql/notification:
    endpoint: notification-db:5432
    transport: tcp
    username: ${env:NOTIFICATION_DB_USER}
    password: ${file:/run/secrets/notification_db_password}
    databases: [notification]
    collection_interval: 15s
    tls:
      ca_file: /tls/ca.pem

  # Consumer lag per group and partition, as the describe-only monitoring user (ADR 0022, ADR 0031).
  kafka_metrics:
    brokers: [kafka:29092]
    protocol_version: 3.9.0
    scrapers: [brokers, topics, consumers]
    topic_match: ^freightflow\..*
    collection_interval: 15s
    auth:
      sasl:
        username: monitoring
        password: ${file:/run/secrets/kafka_monitoring_password}
        mechanism: SCRAM-SHA-512
    # SASL_SSL: the broker's certificate verified against the internal CA's root (ADR 0039).
    tls:
      ca_file: /tls/ca.pem

  # The time left on every certificate the internal CA issued (ADR 0039), from the copies the agent publishes
  # without their keys: CertificateNotRenewed. Generated from infra/tls/identities.conf; a new identity adds a line.
  tls_check:
    collection_interval: 60s
    targets:
      - file_path: /certs/api-gateway.pem
      - file_path: /certs/banking-service.pem
      - file_path: /certs/logistics-service.pem
      - file_path: /certs/notification-service.pem
      - file_path: /certs/banking-db.pem
      - file_path: /certs/logistics-db.pem
      - file_path: /certs/notification-db.pem
      - file_path: /certs/keycloak-db.pem
      - file_path: /certs/keycloak.pem
      - file_path: /certs/kafka.pem
      - file_path: /certs/redis.pem
      - file_path: /certs/mailpit.pem
      - file_path: /certs/partner-simulator.pem
      - file_path: /certs/otel-collector.pem
      - file_path: /certs/prometheus.pem

  redis:
    endpoint: redis:6379
    collection_interval: 15s
    # TLS only (infra/redis/start.sh): the receiver's default is plaintext, so verification is switched on here.
    tls:
      insecure: false
      ca_file: /tls/ca.pem

  # Each container's memory and its limit (ADR 0029), from the Docker socket, mounted read-only.
  docker_stats:
    endpoint: unix:///var/run/docker.sock
    collection_interval: 15s
    timeout: 10s

processors:
  # First in every pipeline: refuse data before the collector runs out of memory (its container has 192 MiB).
  memory_limiter:
    check_interval: 1s
    limit_mib: 150
    spike_limit_mib: 30

  # The second line behind the services' own rule (ADR 0024, ADR 0030): an email address, a bearer token or a JWT in
  # any attribute is masked, whatever its key.
  redaction:
    allow_all_keys: true
    blocked_values:
      - "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}"
      - "(?i)bearer\\s+[A-Za-z0-9._~+/-]+=*"
      - "eyJ[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+"
    blocked_key_patterns:
      - "(?i).*authorization.*"
      - "(?i).*password.*"
    summary: info

  # The redaction processor reads attributes only: a log line's body (the message) gets the same patterns here.
  transform/log_bodies:
    log_statements:
      - context: log
        statements:
          - replace_pattern(log.body, "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}", "****")
          - replace_pattern(log.body, "(?i)bearer\\s+[A-Za-z0-9._~+/-]+=*", "****")

  # Tail-based sampling (ADR 0031): a trace is decided once it is complete. Kept: every trace with an error, every
  # slow trace, every trace that moved money, and TAIL_SAMPLING_PERCENTAGE of the rest (100 in dev and CI, 10 in the
  # production profile). Every span of a trace must reach the same collector: one instance here; several would need
  # the loadbalancing exporter in front, keyed by trace id.
  tail_sampling:
    decision_wait: 10s
    num_traces: 20000
    expected_new_traces_per_sec: 20
    decision_cache:
      sampled_cache_size: 20000
      non_sampled_cache_size: 20000
    policies:
      - name: errors
        type: status_code
        status_code:
          status_codes: [ERROR]
      - name: slow
        type: latency
        latency:
          threshold_ms: 2000
      - name: money-moved
        type: string_attribute
        string_attribute:
          key: freightflow.money.moved
          values: ["true"]
      - name: the-rest
        type: probabilistic
        probabilistic:
          sampling_percentage: ${env:TAIL_SAMPLING_PERCENTAGE}

  # Consumer lag counts records; the receiver says its unit is "1", which Prometheus' translation turns into a
  # "_ratio" suffix. "{record}" is the semantic-conventions annotation, which the translation drops.
  transform/kafka_units:
    metric_statements:
      - context: metric
        statements:
          - set(metric.unit, "{record}") where IsMatch(metric.name, "^kafka\\.consumer_group\\.lag")

  batch:
    timeout: 1s
    send_batch_size: 1024

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
  prometheus_remote_write:
    http:
      endpoint: http://prometheus:9090/api/v1/write
    # Resource attributes (postgresql.database.name, container.name) as labels on every series, which the dashboards
    # and ContainerMemoryNearLimit group by; otherwise they would only be on target_info.
    resource_to_telemetry_conversion:
      enabled: true

service:
  extensions: [health_check]
  # The collector's own metrics (accepted, refused, dropped, queue sizes) for Prometheus to scrape.
  telemetry:
    metrics:
      level: normal
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, redaction, tail_sampling, batch]
      exporters: [otlp/tempo]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, redaction, transform/log_bodies, batch]
      exporters: [otlphttp/loki]
    metrics:
      receivers: [postgresql/banking, postgresql/logistics, postgresql/notification, kafka_metrics, redis, docker_stats,
                  tls_check]
      processors: [memory_limiter, transform/kafka_units, batch]
      exporters: [prometheus_remote_write]
