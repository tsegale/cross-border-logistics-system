# Symptom alerts (docs/slo.md): conditions that need a person whatever the error budget says. Each names its runbook,
# has a promtool test in tests/symptoms.test.yml and fired once in the alert fire drill (scripts/alert_fire_drill.py).
groups:
  - name: money
    rules:
      # The ledger's own invariant (ADR 0004): never acceptable, so no objective and no grace period.
      - alert: LedgerDrift
        expr: max(freightflow_ledger_discrepancies) > 0 or max(freightflow_ledger_unbalanced_currencies) > 0
        labels:
          severity: page
        annotations:
          summary: "The ledger does not reconcile: {{ $value }} account(s) or currencies off"
          description: "An account's stored balance differs from its postings, or a currency's postings do not sum to zero."
          runbook_url: https://github.com/tsegale/cross-border-logistics-system/blob/main/docs/runbooks/ledger-drift.md
      # ADR 0044: the invariant audit found a row that breaks a rule the database cannot express, or stopped running.
      - alert: InvariantViolated
        expr: max by (service, invariant) (freightflow_invariants_violations) > 0
        labels:
          severity: page
        annotations:
          summary: "{{ $labels.service }}: {{ $value }} row(s) break {{ $labels.invariant }}"
          description: "The invariant audit found money or events in a state no correct run produces. Stop what writes it before repairing."
          runbook_url: https://github.com/tsegale/cross-border-logistics-system/blob/main/docs/runbooks/invariant-failure.md
      - alert: InvariantAuditNotRunning
        expr: max by (service) (freightflow_invariants_audit_age_seconds - 1.5 * freightflow_invariants_audit_interval_seconds) > 0
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: "{{ $labels.service }} has not completed an invariant audit for {{ $value | humanizeDuration }} past its schedule"
          description: "The scheduled audit failed or was switched off: a broken invariant would go unnoticed."
          runbook_url: https://github.com/tsegale/cross-border-logistics-system/blob/main/docs/runbooks/invariant-failure.md
      - alert: ReconciliationNotRunning
        expr: max(freightflow_ledger_reconciliation_age_seconds) > 900
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: "The ledger has not been reconciled for {{ $value | humanizeDuration }}"
          description: "The scheduled reconciliation runs every 5 minutes; without it LedgerDrift cannot fire."
          runbook_url: https://github.com/tsegale/cross-border-logistics-system/blob/main/docs/runbooks/ledger-drift.md
      - alert: PaymentCommandsParked
        expr: max(freightflow_payment_commands_parked) > 0
        for: 2m
        labels:
          severity: page
        annotations:
          summary: "{{ $value }} payment command(s) parked, waiting for an operator"
          description: "A hold, capture, release or extension ran out of attempts; its shipment waits for an operator (ADR 0012)."
          runbook_url: https://github.com/tsegale/cross-border-logistics-system/blob/main/docs/runbooks/payment-commands-parked.md
      - alert: ApprovalsNearExpiry
        expr: max(freightflow_approvals_expiring) > 0
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: "{{ $value }} approval request(s) expire within the hour"
          description: "A deposit or reversal waits for a second operator and will expire undecided (ADR 0021)."
          runbook_url: https://github.com/tsegale/cross-border-logistics-system/blob/main/docs/runbooks/approvals-near-expiry.md

  # Daily ECB reference rates (ADR 0034). Stale: FX quotes and cross-currency holds are being refused.
  - name: fx
    rules:
      - alert: FxReferenceRateStale
        expr: max(freightflow_fx_reference_rate_age) > max(freightflow_fx_reference_rate_max_age)
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "The EUR/ZAR reference rate is {{ $value }} working day(s) behind the one due"
          description: "Past the staleness limit: EUR quotes and cross-currency holds are refused with fx-rates-stale until a fresh rate is confirmed."
          runbook_url: https://github.com/tsegale/cross-border-logistics-system/blob/main/docs/runbooks/fx-reference-rates.md
      - alert: FxReferenceRateQuarantined
        expr: max(freightflow_fx_reference_rates_quarantined) > 0
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: "{{ $value }} reference rate(s) quarantined, waiting for two operators"
          description: "A rate failed a check (a large move, off the NAD/ZAR peg, a closing day) and prices nothing until confirmed or rejected."
          runbook_url: https://github.com/tsegale/cross-border-logistics-system/blob/main/docs/runbooks/fx-reference-rates.md
      # Duties are estimated from a dated tariff subset (ADR 0035): past its review date it may be out of date.
      - alert: CustomsTariffReviewOverdue
        expr: min by (market) (freightflow_customs_tariff_days_to_review_days) < 0
        for: 15m
        labels:
          severity: ticket
        annotations:
          summary: "The {{ $labels.market }} tariff subset is past its review date"
          description: "Duty estimates use rates that may have changed: check the source and add a migration with the current rates."
          runbook_url: https://github.com/tsegale/cross-border-logistics-system/blob/main/docs/runbooks/customs-tariff-review.md

  # Carrier events in DCSA Track and Trace (ADR 0037).
  - name: carriers
    rules:
      - alert: CarrierWebhookSignaturesFailing
        expr: sum by (carrier) (increase(freightflow_dcsa_notifications_total{outcome=~"signature-invalid|replay-rejected"}[10m])) > 0
        labels:
          severity: ticket
        annotations:
          summary: "{{ $value | humanize }} carrier notification(s) refused for {{ $labels.carrier }} in 10 minutes"
          description: "A bad signature, an unknown subscription or a replayed notification: a misconfigured carrier, a rotated secret, or someone forging tracking events."
          runbook_url: https://github.com/tsegale/cross-border-logistics-system/blob/main/docs/runbooks/carrier-tracking.md
      # The carriers' webhook has no token, so the gateway budgets it per carrier and per source address (ADR 0041).
      - alert: CarrierWebhooksRateLimited
        expr: sum by (key) (increase(freightflow_gateway_rate_limited_total{route="carrier-webhooks"}[10m])) > 0
        labels:
          severity: ticket
        annotations:
          summary: "{{ $value | humanize }} carrier notification(s) refused by the gateway's {{ $labels.key }} limit in 10 minutes"
          description: "A carrier sending faster than its budget, or one address flooding the unauthenticated webhook."
          runbook_url: https://github.com/tsegale/cross-border-logistics-system/blob/main/docs/runbooks/carrier-tracking.md
      - alert: CarrierPollingBehind
        expr: max by (carrier) (freightflow_dcsa_poll_age_seconds) > 300
        for: 2m
        labels:
          severity: ticket
        annotations:
          summary: "{{ $labels.carrier }} has not been polled successfully for {{ $value | humanizeDuration }}"
          description: "The carrier's DCSA events API does not answer; its shipments' tracking is behind."
          runbook_url: https://github.com/tsegale/cross-border-logistics-system/blob/main/docs/runbooks/carrier-tracking.md

  - name: events
    rules:
      - alert: OutboxStuck
        expr: max by (service, outbox) (freightflow_outbox_oldest_age_seconds) > 60
        for: 2m
        labels:
          severity: page
        annotations:
          summary: "{{ $labels.service }}: the oldest unsent outbox row is {{ $value | humanizeDuration }} old"
          description: "The relay polls every 200 ms (ADR 0025); a minute means the broker, banking or the relay itself is not working."
          runbook_url: https://github.com/tsegale/cross-border-logistics-system/blob/main/docs/runbooks/outbox-stuck.md
      - alert: ConsumerLagHigh
        expr: sum by (group, topic) (kafka_consumer_group_lag) > 100
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: "{{ $labels.group }} is {{ $value }} records behind on {{ $labels.topic }}"
          description: "A consumer is down, stuck on a record, or slower than its producer."
          runbook_url: https://github.com/tsegale/cross-border-logistics-system/blob/main/docs/runbooks/consumer-lag.md
      - alert: DeadLettersWaiting
        expr: sum by (service) (freightflow_dead_letters{status="NEW"}) > 0
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: "{{ $labels.service }}: {{ $value }} dead letter(s) waiting for an operator"
          description: "Events that failed every retry, or could not be read, wait to be redriven (ADR 0026)."
          runbook_url: https://github.com/tsegale/cross-border-logistics-system/blob/main/docs/runbooks/dead-letters.md

  - name: emails
    rules:
      - alert: EmailsUnknown
        expr: max(freightflow_emails{status="UNKNOWN"}) > 0
        for: 1m
        labels:
          severity: ticket
        annotations:
          summary: "{{ $value }} email(s) may not have arrived (UNKNOWN)"
          description: "A sender stopped while handing an email to SMTP; it is never resent on its own (ADR 0027)."
          runbook_url: https://github.com/tsegale/cross-border-logistics-system/blob/main/docs/runbooks/emails-unknown.md
      - alert: EmailsFailing
        expr: sum(increase(freightflow_emails_failed_total{final="true"}[15m])) > 0
        labels:
          severity: ticket
        annotations:
          summary: "Emails were refused by the mail server on every attempt in the last 15 minutes"
          description: "The relay, its credentials or a recipient address is wrong."
          runbook_url: https://github.com/tsegale/cross-border-logistics-system/blob/main/docs/runbooks/emails-failing.md

  - name: platform
    rules:
      - alert: ServiceDown
        expr: up{job=~"services|keycloak"} == 0
        for: 1m
        labels:
          severity: page
        annotations:
          summary: "{{ $labels.service }} does not answer its metrics scrape"
          description: "The container is down, restarting or out of memory."
          runbook_url: https://github.com/tsegale/cross-border-logistics-system/blob/main/docs/runbooks/service-down.md
      - alert: GatewayUpstreamErrors
        expr: sum(rate(spring_cloud_gateway_requests_seconds_count{outcome="SERVER_ERROR"}[5m])) / sum(rate(spring_cloud_gateway_requests_seconds_count[5m])) > 0.05
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "{{ $value | humanizePercentage }} of requests through the gateway end in a server error"
          description: "Every route, not only bookings and transfers: a service or Keycloak is failing behind the gateway."
          runbook_url: https://github.com/tsegale/cross-border-logistics-system/blob/main/docs/runbooks/service-down.md
      # The agent renews a 24 h certificate at 8 h left (ADR 0039) and retries every 5 minutes; under 6 h it has failed
      # for two hours, and at 0 every connection to or from that container fails closed.
      - alert: CertificateNotRenewed
        expr: min by (tlscheck_x509_cn) (tlscheck_time_left_seconds) < 6 * 3600
        for: 10m
        labels:
          severity: page
        annotations:
          summary: "The certificate of {{ $labels.tlscheck_x509_cn }} expires in {{ $value | humanizeDuration }}"
          description: "The certificate agent has not renewed it for two hours; at expiry its TLS connections fail."
          runbook_url: https://github.com/tsegale/cross-border-logistics-system/blob/main/docs/runbooks/certificate-not-renewed.md
      - alert: ContainerMemoryNearLimit
        expr: max by (container_name) (container_memory_usage_total_bytes / container_memory_usage_limit_bytes) > 0.9
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: "{{ $labels.container_name }} uses {{ $value | humanizePercentage }} of its memory limit"
          description: "The limits are sized from measured peaks (ADR 0029); this one is close to being OOM-killed."
          runbook_url: https://github.com/tsegale/cross-border-logistics-system/blob/main/docs/runbooks/container-memory.md
