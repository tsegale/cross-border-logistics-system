# Generated by generate_slo_rules.py. promtool test rules (CI, ADR 0033).
rule_files:
  - ../slo.yml

evaluation_interval: 1m

tests:
  - name: booking_availability burning
    interval: 1m
    input_series:
      - series: 'http_server_requests_seconds_count{service="logistics-service",uri="/api/v1/shipments",method="POST",outcome="SUCCESS"}'
        values: '0+90.0x180'
      - series: 'http_server_requests_seconds_count{service="logistics-service",uri="/api/v1/shipments",method="POST",outcome="SERVER_ERROR"}'
        values: '0+10.0x180'
    alert_rule_test:
      - eval_time: 120m
        alertname: BookingAvailabilityBudgetBurnFast
        exp_alerts:
          - exp_labels: {severity: page, slo: booking_availability}
            exp_annotations:
              summary: "Bookings are failing with server errors (fast burn of the 99.5 % objective)"
              description: "Error ratio 10% over the long window; at this rate the 28-day budget of 0.5 % runs out early."
              runbook_url: https://github.com/tsegale/cross-border-logistics-system/blob/main/docs/runbooks/slo-booking-availability.md
      - eval_time: 120m
        alertname: BookingAvailabilityBudgetBurnSlow
        exp_alerts:
          - exp_labels: {severity: ticket, slo: booking_availability}
            exp_annotations:
              summary: "Bookings are failing with server errors (slow burn of the 99.5 % objective)"
              description: "Error ratio 10% over the long window; at this rate the 28-day budget of 0.5 % runs out early."
              runbook_url: https://github.com/tsegale/cross-border-logistics-system/blob/main/docs/runbooks/slo-booking-availability.md
  - name: booking_availability inside the budget
    interval: 1m
    input_series:
      - series: 'http_server_requests_seconds_count{service="logistics-service",uri="/api/v1/shipments",method="POST",outcome="SUCCESS"}'
        values: '0+99.75x180'
      - series: 'http_server_requests_seconds_count{service="logistics-service",uri="/api/v1/shipments",method="POST",outcome="SERVER_ERROR"}'
        values: '0+0.25x180'
    alert_rule_test:
      - eval_time: 120m
        alertname: BookingAvailabilityBudgetBurnFast
        exp_alerts: []
      - eval_time: 120m
        alertname: BookingAvailabilityBudgetBurnSlow
        exp_alerts: []
  - name: booking_availability recovers
    interval: 1m
    input_series:
      - series: 'http_server_requests_seconds_count{service="logistics-service",uri="/api/v1/shipments",method="POST",outcome="SUCCESS"}'
        values: '0+90x60 5400+100x100'
      - series: 'http_server_requests_seconds_count{service="logistics-service",uri="/api/v1/shipments",method="POST",outcome="SERVER_ERROR"}'
        values: '0+10x60 600+0x100'
    alert_rule_test:
      - eval_time: 160m
        alertname: BookingAvailabilityBudgetBurnFast
        exp_alerts: []
  - name: transfer_availability burning
