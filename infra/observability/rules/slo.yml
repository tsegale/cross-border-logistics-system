  - name: slo-burn-rate-alerts
    rules:
      - alert: BookingAvailabilityBudgetBurnFast
        expr: (slo:booking_availability:error_ratio_rate1h > (14.4 * 0.005) and slo:booking_availability:error_ratio_rate5m > (14.4 * 0.005)) or (slo:booking_availability:error_ratio_rate6h > (6 * 0.005) and slo:booking_availability:error_ratio_rate30m > (6 * 0.005))
        for: 2m
        labels:
          severity: page
          slo: booking_availability
        annotations:
          summary: "Bookings are failing with server errors (fast burn of the 99.5 % objective)"
          description: "Error ratio {{ $value | humanizePercentage }} over the long window; at this rate the 28-day budget of 0.5 % runs out early."
          runbook_url: https://github.com/tsegale/cross-border-logistics-system/blob/main/docs/runbooks/slo-booking-availability.md
      - alert: BookingAvailabilityBudgetBurnSlow
        expr: (slo:booking_availability:error_ratio_rate1d > (3 * 0.005) and slo:booking_availability:error_ratio_rate2h > (3 * 0.005)) or (slo:booking_availability:error_ratio_rate3d > (1 * 0.005) and slo:booking_availability:error_ratio_rate6h > (1 * 0.005))
        for: 15m
