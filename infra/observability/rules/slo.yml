          description: "Error ratio {{ $value | humanizePercentage }} over the long window; at this rate the 28-day budget of 5 % runs out early."
          runbook_url: https://github.com/tsegale/cross-border-logistics-system/blob/main/docs/runbooks/slo-booking-latency.md
      - alert: BookingLatencyBudgetBurnSlow
        expr: (slo:booking_latency:error_ratio_rate1d > (3 * 0.05) and slo:booking_latency:error_ratio_rate2h > (3 * 0.05)) or (slo:booking_latency:error_ratio_rate3d > (1 * 0.05) and slo:booking_latency:error_ratio_rate6h > (1 * 0.05))
        for: 15m
