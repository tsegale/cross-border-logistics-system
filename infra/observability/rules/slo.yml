          summary: "Transfers are failing with server errors (slow burn of the 99.5 % objective)"
          description: "Error ratio {{ $value | humanizePercentage }} over the long window; at this rate the 28-day budget of 0.5 % runs out early."
          runbook_url: https://github.com/tsegale/cross-border-logistics-system/blob/main/docs/runbooks/slo-transfer-availability.md
      - alert: BookingLatencyBudgetBurnFast
        expr: (slo:booking_latency:error_ratio_rate1h > (14.4 * 0.05) and slo:booking_latency:error_ratio_rate5m > (14.4 * 0.05)) or (slo:booking_latency:error_ratio_rate6h > (6 * 0.05) and slo:booking_latency:error_ratio_rate30m > (6 * 0.05))
