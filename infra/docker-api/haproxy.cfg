# The Docker API, read-only and narrowed to what the collector's docker_stats receiver reads (ADR 0041): a process
# with the Docker socket can start a privileged container and own the host, so the collector gets this instead.
#   GET /_ping, /version            the client's handshake
#   GET /containers/json            the list
#   GET /containers/<id>/json       inspect: names, labels and limits for the metric's attributes
#   GET /containers/<id>/stats      memory and CPU
# Everything else, every other method included, is a 403. Inspect shows a container's environment: Keycloak's
# env_file secrets are among what the collector could read, a residual in ADR 0041.
global
    log stdout format raw local0 warning

defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend docker-api
    bind :2375
    acl read method GET HEAD
    acl handshake path_reg ^(/v[0-9.]+)?/(_ping|version)$
    acl list path_reg ^(/v[0-9.]+)?/containers/json$
    acl one path_reg ^(/v[0-9.]+)?/containers/[a-zA-Z0-9_.-]+/(json|stats)$
    http-request deny deny_status 403 unless read
    http-request deny deny_status 403 unless handshake or list or one
    default_backend docker

backend docker
    server docker /var/run/docker.sock
